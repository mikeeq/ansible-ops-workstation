---
- name: Install dependencies
  ansible.builtin.package:
    name: zsh
    state: present

- name: Import user.yaml
  ansible.builtin.import_tasks: user.yaml
- name: Import ssh_keys.yaml
  ansible.builtin.import_tasks: ssh_keys.yaml

- name: Meta flush_handlers
  ansible.builtin.meta: flush_handlers
