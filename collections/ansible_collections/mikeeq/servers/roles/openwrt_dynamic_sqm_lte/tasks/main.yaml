---
# https://github.com/lynxthecat/cake-autorate
- name: Install dependencies
  ansible.builtin.package:
    name: "{{ sqm_opkgs }}"
    state: present
  vars:
    sqm_opkgs:
      - bash
      - fping
      - iputils-ping
      - luci-app-sqm

# TODO: Add update mechanism
# cat cake-autorate/cake-autorate.sh | grep -i 'version=' | cut -d'"' -f2 | awk '{print $1}'
- name: Install cake-autorate
  ansible.builtin.shell: |
    wget -O /tmp/cake-autorate_setup.sh https://raw.githubusercontent.com/lynxthecat/CAKE-autorate/master/setup.sh
    sh /tmp/cake-autorate_setup.sh
  args:
    creates: /root/cake-autorate/cake-autorate.sh

- name: Configure dynamic SQM config
  ansible.builtin.template:
    src: "cake-autorate_config.sh"
    dest: "/root/cake-autorate/cake-autorate_config.primary.sh"
    owner: "root"
    group: "root"
    mode: "0755"

- name: Set vars to enable SQM
  ansible.builtin.set_fact:
    openwrt_dynamic_sqm_lte_cake_service: "start"
    openwrt_dynamic_sqm_lte_sqm_enabled: "1"
  when: openwrt_dynamic_sqm_lte_dynamic_sqm_enabled == "true"

- name: Set vars to disable SQM
  ansible.builtin.set_fact:
    openwrt_dynamic_sqm_lte_cake_service: "stop"
    openwrt_dynamic_sqm_lte_sqm_enabled: "0"
  when: openwrt_dynamic_sqm_lte_dynamic_sqm_enabled == "false"

- name: Change config SQM
  ansible.builtin.lineinfile:
    regexp: "option\\senabled"
    # \s{8}option\senabled\s.\d.
    line: "        option enabled '{{ openwrt_dynamic_sqm_lte_sqm_enabled }}'"
    path: /etc/config/sqm
  register: openwrt_dynamic_sqm_lte_sqm_config

- name: Restart SQM service
  ansible.builtin.shell: service sqm restart
  when: openwrt_dynamic_sqm_lte_sqm_config.changed

- name: Check Dynamic SQM service status
  ansible.builtin.shell: service cake-autorate status
  register: openwrt_dynamic_sqm_lte_dynamic_sqm_status
  changed_when: false
  failed_when: false

- name: "Change Dynamic SQM ansible.builtin.service: {{ openwrt_dynamic_sqm_lte_cake_service }}"
  ansible.builtin.shell: service cake-autorate {{ openwrt_dynamic_sqm_lte_cake_service }}
  when: (openwrt_dynamic_sqm_lte_dynamic_sqm_status.stdout == "running" and openwrt_dynamic_sqm_lte_cake_service == "stop") or (openwrt_dynamic_sqm_lte_dynamic_sqm_status.stdout == "inactive" and openwrt_dynamic_sqm_lte_cake_service == "start")
