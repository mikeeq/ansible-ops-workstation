---
cloud_init_src_dir: "/var/lib/libvirt/cloud_init_config"  # noqa: var-naming[no-role-prefix]
cloud_init_iso_dir: "/var/lib/libvirt/cloud_init_iso"  # noqa: var-naming[no-role-prefix]

cloud_init_config_files:  # noqa: var-naming[no-role-prefix]
  - src: user-data.yaml.j2
    dest: user-data
  - src: network-config.yaml.j2
    dest: network-config
  - src: meta-data.yaml.j2
    dest: meta-data

# https://cloudinit.readthedocs.io/en/latest/topics/modules.html
# https://cloudinit.readthedocs.io/en/latest/topics/network-config-format-v2.html
# https://cloudinit.readthedocs.io/en/latest/topics/instancedata.html
# https://cloudinit.readthedocs.io/en/latest/topics/datasources/nocloud.html

# https://mirroronet.pl/pub/mirrors/fedora/linux/releases/41/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-41-1.4.x86_64.qcow2
# https://mirroronet.pl/pub/mirrors/fedora/linux/releases/41/Cloud/x86_64/images/Fedora-Cloud-Base-UEFI-UKI-41-1.4.x86_64.qcow2
# https://mirrors.hostiserver.com/fedora/fedora/linux/releases/42/Cloud/x86_64/images/Fedora-Cloud-Base-UEFI-UKI-42-1.1.x86_64.qcow2
cloud_image_url: "https://download.fedoraproject.org/pub/fedora/linux/releases/42/Cloud/x86_64/images/Fedora-Cloud-Base-UEFI-UKI-42-1.1.x86_64.qcow2"  # noqa: var-naming[no-role-prefix]
cloud_image_name: "Fedora-Cloud-Base-UEFI-UKI-42-1.1.x86_64.qcow2"  # noqa: var-naming[no-role-prefix]
cloud_image_checksum: "sha256:acaab7d42e413264b92a7b0edb0b07aaf903bb8ed33ec880f73bca92e751269e"  # noqa: var-naming[no-role-prefix]

libvirt_images_dir: "/var/lib/libvirt/images"

vms:  # noqa: var-naming[no-role-prefix]
  - name: "dns3"
    hostname: dns3
    cpu: 1
    memory: 512
    disk_size: 20G
    src_image: "{{ cloud_image_name }}"
    ipv4_addresses:
      - 192.168.1.33/24
    gateway4: 192.168.1.1
    dns_servers:
      - 1.1.1.1
      - 8.8.8.8

vms_to_remove: []  # noqa: var-naming[no-role-prefix]
# - name: dns3

# bridge or nat
vm_network: "nat"  # noqa: var-naming[no-role-prefix]
# set if bridge
# baremetal_bridge_interface: "br-vm-enp42s0"
vm_force_recreation: false  # noqa: var-naming[no-role-prefix]
vm_force_cloud_init_recreation: false  # noqa: var-naming[no-role-prefix]

qemu_emulator: "/usr/bin/qemu-kvm"  # noqa: var-naming[no-role-prefix]
# qemu_emulator: "/usr/bin/qemu-system-x86_64"
# qemu_emulator: "/usr/bin/qemu-system-aarch64"

default_admin_username: testuser  # noqa: var-naming[no-role-prefix]
default_admin_password: test_pass  # noqa: var-naming[no-role-prefix]
