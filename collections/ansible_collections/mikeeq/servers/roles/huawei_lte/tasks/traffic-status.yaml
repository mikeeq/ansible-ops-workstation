---
- name: Grab traffic status
  ansible.builtin.uri:
    url: "{{ huawei_lte_huawei_url }}/api/monitoring/traffic-statistics"
    return_content: true
    method: GET
    headers:
      Content-Type: text/xml
      Cookie: "{{ huawei_lte_login_request.cookies_string }}"
  register: huawei_lte_traffic_status_request
  failed_when: '"<error>" in huawei_lte_traffic_status_request.content'

- name: Transform huawei_lte_traffic_status_request from XML to YAML
  ansible.builtin.set_fact:
    traffic_status_request_yaml: "{{ huawei_lte_traffic_status_request.content | ansible.utils.from_xml }}"

- name: Show huawei_lte_traffic_status_request response content in YAML
  ansible.builtin.debug:
    var: traffic_status_request_yaml.response
