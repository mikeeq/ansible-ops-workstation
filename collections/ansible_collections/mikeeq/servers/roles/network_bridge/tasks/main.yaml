- name: Set var network_bridge_nic_name
  ansible.builtin.set_fact:
    network_bridge_nic_name: "{{ network_bridge_baremetal_lan_interface }}"

- name: Set vars network_bridge_bridge_name and network_bridge_bridge_slave_name
  ansible.builtin.set_fact:
    network_bridge_bridge_name: "br-vm-{{ network_bridge_nic_name }}"
    network_bridge_bridge_slave_name: "br-vm-slave-{{ network_bridge_nic_name }}"

- name: Check active connection
  # ansible.builtin.shell: nmcli con show --active | grep -i ethernet | grep -w {{ network_bridge_nic_name }} | awk '{print $1}' | head -n1
  ansible.builtin.shell: nmcli -t -f NAME,TYPE,DEVICE c show --active | grep -v {{ network_bridge_bridge_slave_name }} | grep -w {{ network_bridge_nic_name }} | grep -i ethernet | cut -d':'
    -f1
  register: network_bridge_nmcli_active
  changed_when: false

- name: Add bridge
  community.general.nmcli:
    conn_name: "{{ network_bridge_bridge_name }}"
    ifname: "{{ network_bridge_bridge_name }}"
    type: bridge
    ip4: "{{ network_bridge_baremetal_bridge_interface_cidr }}"
    gw4: "{{ network_bridge_baremetal_bridge_interface_default_gw }}"
    state: "{{ network_bridge_baremetal_bridge_state }}"
    autoconnect: true

- name: Add bridge-slave
  community.general.nmcli:
    conn_name: "{{ network_bridge_bridge_slave_name }}"
    ifname: "{{ network_bridge_nic_name }}"
    type: bridge-slave
    master: "{{ network_bridge_bridge_name }}"
    state: "{{ network_bridge_baremetal_bridge_state }}"
    hairpin: false
    autoconnect: true

- name: Allow ip forwarding for bridge network
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: "^{{ item.key | regex_escape }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "0" }
    - { key: "net.bridge.bridge-nf-call-iptables", value: "0" }
    - { key: "net.bridge.bridge-nf-call-arptables", value: "0" }
    - { key: "net.ipv6.conf.all.disable_ipv6", value: "{{ network_bridge_disable_ipv6 | bool | ternary('1', '0') }}" }
    - { key: "net.ipv6.conf.default.disable_ipv6", value: "{{ network_bridge_disable_ipv6 | bool | ternary('1', '0') }}" }
    - { key: "net.ipv6.conf.lo.disable_ipv6", value: "{{ network_bridge_disable_ipv6 | bool | ternary('1', '0') }}" }
  loop_control:
    label: "{{ item.key }}"
  register: network_bridge_sysctl_changes

- name: Reload sysctl
  # net.bridge.* keys fail until br_netfilter is loaded; the remaining keys are still applied
  ansible.builtin.shell: sysctl -p || true
  when: network_bridge_sysctl_changes.changed

- name: Get IPv6 settings of the bridge connection
  ansible.builtin.command: nmcli -g ipv6.addr-gen-mode,ipv6.token connection show {{ network_bridge_bridge_name }}
  register: network_bridge_ipv6_current
  changed_when: false
  check_mode: false
  when: network_bridge_ipv6_token | length > 0

# Stable interface ID (e.g. ::110) - the address suffix survives ISP prefix changes
- name: Set stable IPv6 token on the bridge connection
  ansible.builtin.shell: |
    nmcli connection modify {{ network_bridge_bridge_name }} ipv6.addr-gen-mode eui64 ipv6.token {{ network_bridge_ipv6_token }}
    nmcli device reapply {{ network_bridge_bridge_name }}
  when:
    - network_bridge_ipv6_token | length > 0
    - network_bridge_ipv6_current.stdout_lines | default([]) != ['eui64', network_bridge_ipv6_token]
  changed_when: true

- name: Disable previous connection
  community.general.nmcli:
    conn_name: "{{ network_bridge_nmcli_active.stdout }}"
    ifname: "{{ network_bridge_nic_name }}"
    state: absent
  when: network_bridge_nmcli_active.stdout != ""

