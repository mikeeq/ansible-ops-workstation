---
- name: Install sfp dependencies
  community.general.apk:
    name: "{{ opkgs }}"
    state: present
    update_cache: true
  vars:
    opkgs:
      - kmod-macvlan
      - kmod-phy-airoha-en8811h
      - kmod-phy-amd
      - kmod-phy-aquantia
      - kmod-phy-at803x
      - kmod-phy-ax88796b
      - kmod-phy-bcm84881
      - kmod-phy-broadcom
      - kmod-phy-intel-xway
      - kmod-phy-marvell
      - kmod-phy-marvell-10g
      - kmod-phy-micrel
      - kmod-phy-microchip
      - kmod-phy-qca83xx
      - kmod-phy-realtek
      - kmod-phy-smsc
      - kmod-phy-vitesse
      - kmod-phylib-broadcom
      - kmod-phylib-qcom

- name: Disable mwan3 (conflicts with custom connmark rules)
  community.general.openwrt_init:
    name: mwan3
    enabled: false
    state: stopped
  failed_when: false

- name: Deploy wan2 connmark nftables rules
  ansible.builtin.copy:
    src: wan2-connmark.nft
    dest: /etc/nftables.d/wan2-connmark.nft
    mode: "0644"
  notify: Restart firewall

- name: Deploy wan2 ip rule hotplug script
  ansible.builtin.copy:
    src: wan2-ip-rule.sh
    dest: /etc/hotplug.d/iface/90-wan2-iprule
    mode: "0755"
  notify: Restart network

- name: Install nvme dependencies
  community.general.apk:
    name: "{{ opkgs }}"
    state: present
    update_cache: true
  vars:
    opkgs:
      - block-mount
      - e2fsprogs
      - kmod-usb-storage-uas
      - kmod-usb3
      - kmod-fs-ext4
      - kmod-nvme
      - libnvme
      - nvme-cli
      - fdisk
