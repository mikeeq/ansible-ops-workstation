---
- name: Import dnf5.yaml
  ansible.builtin.import_tasks: dnf5.yaml
- name: Import repos.yaml
  ansible.builtin.import_tasks: repos.yaml

- name: "[DNF] Install Apps"
  ansible.builtin.dnf5:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ generic_pkgs }}"
    - "{{ dnf_pkgs }}"
    - "{{ dnf_gui_pkgs }}"
    - "{{ dnf_extra_pkgs }}"

- name: Import update.yaml
  ansible.builtin.import_tasks: update.yaml
  tags:
    - update
