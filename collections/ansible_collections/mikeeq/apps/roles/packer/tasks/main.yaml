---
- name: Get installed packer_version
  ansible.builtin.shell: packer --version | awk '{print $2}' | cut -d'v' -f2
  register: packer_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed packer_version of packer:"
  ansible.builtin.debug:
    var: packer_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: packer_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when: packer_installed_version.stdout != packer_version
