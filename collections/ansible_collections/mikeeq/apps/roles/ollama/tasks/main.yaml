---
- name: Get installed ollama_version of ollama
  ansible.builtin.shell: ollama --ollama_version | awk '{print $3}'
  register: ollama_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed ollama_version of ollama:"
  ansible.builtin.debug:
    var: ollama_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: ollama_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when: ollama_installed_version.stdout != ollama_version
