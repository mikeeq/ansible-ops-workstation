---
# terraform_0.11.7_linux_amd64.zip
- name: Install dependencies
  ansible.builtin.package:
    name: "{{ pkgs }}"
    state: present
  vars:
    pkgs:
      - unzip
      - tar

- name: Get installed terraform_version
  ansible.builtin.shell: terraform terraform_version | head -n 1 | grep v | cut -d'v' -f2
  register: terraform_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed terraform_version of terraform:"
  ansible.builtin.debug:
    var: terraform_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: terraform_version is not defined

- name: Download terraform
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ architecture_common_name }}.zip"
    dest: /tmp/terraform.zip
    mode: "0644"
  when: terraform_installed_version.stdout != terraform_version

- name: Unarchive a file that is already on the remote machine
  ansible.builtin.unarchive:
    src: /tmp/terraform.zip
    dest: /usr/local/bin/
    remote_src: true
  when: terraform_installed_version.stdout != terraform_version

- name: Set permissions terraform
  ansible.builtin.file:
    path: /usr/local/bin/terraform
    mode: "0755"
    owner: root
    group: root
