---
- name: Get installed hadolint_version of hadolint
  become: true
  become_user: "{{ user_name }}"
  ansible.builtin.shell: hadolint -v | awk '{print $4}' | cut -d'-' -f1 | cut -d'v' -f2
  register: hadolint_installed_version
  changed_when: false
  ignore_errors: true

- name: Include architecture-specific vars
  ansible.builtin.include_vars: "{{ ansible_facts['architecture'] }}.yaml"

- name: "Installed hadolint_version of hadolint:"
  ansible.builtin.debug:
    var: hadolint_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: hadolint_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when: hadolint_installed_version.stdout != hadolint_version
