---
- name: Get latest kubescore_version kubescore
  ansible.builtin.shell: curl -Is https://github.com/zegl/kube-score/releases/latest | grep -i 'location:' | cut -f2 -d'v' | cut -f1 -d'"'
  register: kubescore_version
  changed_when: false

- name: "Latest kubescore_version of kubescore:"
  ansible.builtin.debug:
    var: kubescore_version.stdout

- name: "Set fact with latest kubescore_version of kubescore"
  ansible.builtin.set_fact:
    kubescore_version: "{{ kubescore_version.stdout }}"
