---
- name: Get latest kail_version of kail
  ansible.builtin.shell: curl -Is https://github.com/boz/kail/releases/latest | grep -i 'location:' | cut -f2 -d'v' | cut -f1 -d'"'
  register: kail_version
  changed_when: false

- name: "Latest kail_version of kail:"
  ansible.builtin.debug:
    var: kail_version.stdout

- name: "Set fact with latest kail_version of kail"
  ansible.builtin.set_fact:
    kail_version: "{{ kail_version.stdout }}"
