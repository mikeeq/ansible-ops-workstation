---
- name: Get installed kail_version
  become: true
  become_user: "{{ user_name }}"
  ansible.builtin.shell: kail kail_version | awk '{print $1}' | cut -d'v' -f2
  register: kail_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed kail_version of kail:"
  ansible.builtin.debug:
    var: kail_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: kail_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when: kail_installed_version.stdout != kail_version
