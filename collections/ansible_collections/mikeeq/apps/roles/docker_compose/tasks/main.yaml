---
- name: Get installed docker_compose_version of docker_compose
  become: true
  ansible.builtin.shell: docker-compose docker_compose_version --short | cut -d'v' -f2
  register: docker_compose_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed docker_compose_version of docker_compose:"
  ansible.builtin.debug:
    var: docker_compose_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: docker_compose_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when: docker_compose_installed_version.stdout != docker_compose_version
