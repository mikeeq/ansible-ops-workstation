---
- name: Get installed helm_version
  ansible.builtin.shell: helm version --short | cut -d'+' -f1 | cut -d'v' -f3 | cut -f1 -d'"'
  register: helm_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed helm_version of helm:"
  ansible.builtin.debug:
    var: helm_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: helm_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when: helm_installed_version.stdout != helm_version
