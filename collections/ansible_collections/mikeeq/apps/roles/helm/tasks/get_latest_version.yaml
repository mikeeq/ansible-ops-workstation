---
- name: Get latest helm_version
  ansible.builtin.shell: curl -Is https://github.com/helm/helm/releases/latest | grep -i 'location:' | cut -f2 -d'v' | cut -f1 -d'"'
  register: helm_version
  changed_when: false

- name: "Latest helm_version of helm:"
  ansible.builtin.debug:
    var: helm_version.stdout

- name: "Set fact with latest helm_version of helm"
  ansible.builtin.set_fact:
    helm_version: "{{ helm_version.stdout }}"
