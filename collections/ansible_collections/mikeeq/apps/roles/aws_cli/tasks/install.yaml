- name: Install PIPx aws-cli
  community.general.pipx:
    name: "https://github.com/aws/aws-cli/archive/refs/tags/{{ aws_cli_version }}.tar.gz"
    state: present
    install_deps: true
    global: true
    executable: /usr/bin/pipx
    python: "python3.14"
    force: true
