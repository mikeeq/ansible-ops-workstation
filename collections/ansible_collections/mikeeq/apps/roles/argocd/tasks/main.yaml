---
- name: Get installed argocd_version of argocd
  become: true
  become_user: "{{ user_name }}"
  ansible.builtin.shell: argocd version --client --short | awk '{print $2}' | cut -d'+' -f1 | cut -d'v' -f2
  register: argocd_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed argocd_version of argocd:"
  ansible.builtin.debug:
    var: argocd_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: argocd_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when: argocd_installed_version.stdout != argocd_version
