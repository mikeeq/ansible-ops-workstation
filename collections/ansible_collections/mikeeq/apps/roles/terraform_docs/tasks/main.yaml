---
- name: Get installed terraform_docs_version
  become: true
  become_user: "{{ user_name }}"
  ansible.builtin.shell: terraform-docs terraform_docs_version | awk '{print $3}' | cut -f2 -d'v'
  register: terraform_docs_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed terraform_docs_version of terraform_docs:"
  ansible.builtin.debug:
    var: terraform_docs_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: terraform_docs_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when: terraform_docs_installed_version.stdout != terraform_docs_version
