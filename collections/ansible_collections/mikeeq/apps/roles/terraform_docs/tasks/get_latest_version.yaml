---
- name: Get latest terraform_docs_version of terraform_docs
  ansible.builtin.shell: curl -Is https://github.com/terraform-docs/terraform-docs/releases/latest | grep -i 'location:' | cut -f2 -d'v' | cut -f1 -d'"'
  register: terraform_docs_version
  changed_when: false

- name: "Latest terraform_docs_version of terraform_docs:"
  ansible.builtin.debug:
    var: terraform_docs_version.stdout

- name: "Set fact with latest terraform_docs_version of terraform_docs"
  ansible.builtin.set_fact:
    terraform_docs_version: "{{ terraform_docs_version.stdout }}"
