  #   image: nginx:1.23
  #   container_name: app2
  #   restart: always # other option: always - if you want persistent through host reboots
  #   expose:
  #     - '80'
  #   ports:
  #     - '18090:80'

# IPv6 in the nginx network: ip6tables DNAT keeps the real client IPv6 address (no docker-proxy)
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: {{ nginx_docker_subnet_ipv4 }}
        - subnet: {{ nginx_docker_subnet_ipv6 }}
