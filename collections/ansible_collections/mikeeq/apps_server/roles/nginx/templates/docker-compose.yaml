# https://docs.docker.com/compose/compose-file/compose-file-v3/
---
version: '3.8'
services:
  nginx:
    # https://hub.docker.com/_/nginx
    image: nginx:stable
    container_name: nginx
    restart: always # other option: always - if you want persistent through host reboots
    expose:
      - '80'
      - '443'
    ports:
      # explicit IPv4 + IPv6 host bindings (IPv6: Starlink, Clevo ::110)
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      - '[::]:80:80'
      - '[::]:443:443'
    volumes:
      - './logs:/var/log/nginx'
      - './config/nginx.conf:/etc/nginx/nginx.conf'
      - './config/backend-not-found.html:/var/www/error_page/backend-not-found.html'
      - '/etc/ssl/le:/etc/ssl/le'
      - './config/dhparam.pem:/etc/nginx/dhparam.pem'
    logging:
      driver: "json-file"
      options:
        max-size: "250m"
  # app:
  #   # https://hub.docker.com/_/nginx
  #   image: httpd:2
  #   container_name: app
  #   restart: always # other option: always - if you want persistent through host reboots
