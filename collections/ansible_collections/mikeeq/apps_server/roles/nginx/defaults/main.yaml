---
nginx_install_path: "/opt/nginx"

# Addresses denied on sites with allowed_subnet even though they are inside it,
# e.g. a router that SNATs internet traffic into the LAN (it would otherwise
# make "LAN only" sites reachable from the internet)
nginx_lan_only_deny: []
# Subnet allowed on lan_only_locations of public sites
nginx_lan_subnet: "192.168.0.0/16"

# Optional per-site keys:
#   allowed_subnet: "192.168.0.0/18"  # allow only this subnet
#   lan_only_locations: ["/admin"]    # paths of a public site reachable only from nginx_lan_subnet
#   lan_only_subnet: "192.168.0.0/18" # overrides nginx_lan_subnet for lan_only_locations
#   csp: "default-src 'self' ..."     # custom CSP, false to let the backend set it
#   deny_dotfiles: false              # default true, blocks /.* paths except /.well-known
#   proxy_buffering: false            # default true, false disables request/response buffering
#   proxy_timeout: "3600s"            # proxy send/read timeout, default 60s
#   location_extra_config: |          # raw nginx directives added to "location /"
#     rewrite ^/old$ /new break;
#   server_extra_config: |            # raw nginx directives added to the server block (e.g. extra locations)
#     location = /.well-known/x.pem { proxy_pass http://backend/x.pem; }
nginx_sites:
  - source_url: "http://localhost:8080"
    destination_url: "web.example.com"
    cert:
      crt_path: "/etc/ssl/cert.crt"
      key_path: "/etc/ssl/cert.key"

nginx_error_page:
  cert:
    crt_path: "/etc/ssl/cert.crt"
    key_path: "/etc/ssl/cert.key"

nginx_certs:
  - cn: "web.example.com"
    domain_name: "web.example.com"
nginx_certs_path: "/etc/ssl/certs"

# Docker network of nginx (IPv4 must stay within HA trusted_proxies 172.16.0.0/12)
nginx_docker_subnet_ipv4: "172.18.0.0/16"
nginx_docker_subnet_ipv6: "fd0f:c7e6:9f79:18::/64"
