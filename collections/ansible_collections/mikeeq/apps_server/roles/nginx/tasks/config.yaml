---
- name: Generate DH Parameters with a different size (2048 bits)
  community.crypto.openssl_dhparam:
    path: "{{ nginx_install_path }}/config/dhparam.pem"
    size: 2048

- name: Create directories for certs
  ansible.builtin.file:
    path: "{{ nginx_certs_path }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ nginx_certs | map(attribute='cn') }}"

- name: Copy certs
  ansible.builtin.copy:
    src: "{{ nginx_certs_path }}/{{ item.0 }}/{{ item.1 }}"
    dest: "{{ nginx_certs_path }}/{{ item.0 }}/{{ item.1 }}"
    owner: root
    group: root
    mode: "0644"
  with_nested:
    - "{{ nginx_certs | map(attribute='cn') }}"
    - ["cert.key", "cert.crt", "cert.fullchain"]
  register: nginx_cert_flag
