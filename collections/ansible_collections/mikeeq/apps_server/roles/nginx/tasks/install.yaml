---
- name: Ensure install dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ nginx_install_path }}"
    - "{{ nginx_install_path }}/config"

- name: Configure docker-compose file
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ nginx_install_path }}/{{ item }}"
    mode: "0664"
    backup: true
  loop:
    - docker-compose.yaml
    - config/nginx.conf
    - config/backend-not-found.html
  register: nginx_config_flag

- name: Import config.yaml
  ansible.builtin.import_tasks: config.yaml

- name: Pull Docker image using docker-compose
  ansible.builtin.command: docker-compose pull
  changed_when: nginx_pull_result.stderr_lines | length > 2
  register: nginx_pull_result
  args:
    chdir: "{{ nginx_install_path }}"

- name: Run using docker-compose
  ansible.builtin.shell: docker-compose up -d 2>&1
  changed_when: '"Started" in nginx_up_result.stdout'
  register: nginx_up_result
  args:
    chdir: "{{ nginx_install_path }}"

- name: Restart using docker-compose
  ansible.builtin.command: docker-compose restart
  args:
    chdir: "{{ nginx_install_path }}"
  when: nginx_cert_flag.changed or nginx_config_flag.changed
