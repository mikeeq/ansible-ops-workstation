# https://docs.docker.com/compose/compose-file/compose-file-v3/
---
version: '3.8'
services:
  adguard:
    container_name: adguard
    image: adguard/adguardhome:latest
    # environment:
      # WEBPASSWORD: 'set a secure password here or it will be random'
    # Volumes store your data between container upgrades
    volumes:
      - './workdir:/opt/adguardhome/work'
      - './confdir:/opt/adguardhome/conf'
    # Recommended but not required (DHCP needs NET_ADMIN)
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    # cap_add:
    #   - NET_ADMIN
    # Own IP on the LAN via macvlan (replaces network_mode: host).
    networks:
      {{ adguard_home_macvlan_network_name }}:
        ipv4_address: {{ adguard_home_macvlan_ip }}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "250m"
    # expose:
    #   - '3000'
    #   - '53'
    #   - '80'
    # ports:
    #   - '53:53'
    #   - '3000:3000'
    #   - '80:80'

networks:
  {{ adguard_home_macvlan_network_name }}:
    external: true

# adguard web starts on 80 port (bind_hosts 0.0.0.0), reachable at its macvlan IP
