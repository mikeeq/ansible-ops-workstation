---
- name: Ensure Dagu install dir exists
  ansible.builtin.file:
    path: "{{ dagu_install_path }}"
    state: directory
    mode: "0755"

- name: Ensure Dagu directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ dagu_uid }}"
    group: "{{ dagu_gid }}"
    mode: "{{ item.mode }}"
    state: directory
  loop:
    - { path: "{{ dagu_data_path }}", mode: "0755" }
    - { path: "{{ dagu_dags_path }}", mode: "0755" }
    - { path: "{{ dagu_user_home_path }}", mode: "0750" }
    - { path: "{{ dagu_ssh_path }}", mode: "0700" }
    - { path: "{{ dagu_secrets_path }}", mode: "0700" }
  loop_control:
    label: "{{ item.path }}"

- name: Configure ssh config
  ansible.builtin.template:
    src: "ssh_config.j2"
    dest: "{{ dagu_ssh_path }}/config"
    owner: "{{ dagu_uid }}"
    group: "{{ dagu_gid }}"
    mode: "0600"

- name: Copy private SSH keys
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ dagu_ssh_path }}/{{ item.name }}"
    owner: "{{ dagu_uid }}"
    group: "{{ dagu_gid }}"
    mode: "0600"
  loop: "{{ dagu_ssh_private_keys }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Copy git-crypt key
  ansible.builtin.copy:
    content: "{{ dagu_git_crypt_key | b64decode }}"
    dest: "{{ dagu_secrets_path }}/git_crypt_key"
    owner: "{{ dagu_uid }}"
    group: "{{ dagu_gid }}"
    mode: "0600"
  when: dagu_git_crypt_key | length > 0
  no_log: true

- name: Write Dagu auth secrets
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ dagu_secrets_path }}/{{ item.name }}"
    owner: "{{ dagu_uid }}"
    group: "{{ dagu_gid }}"
    mode: "0600"
  loop:
    - { name: "admin_password", value: "{{ dagu_admin_password }}" }
    - { name: "auth_token_secret", value: "{{ dagu_auth_token_secret }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.value | length > 0
  no_log: true
