# Gas tariff from the last myORLEN invoice (P/1511194/0007/26, W-3.9, gross); `initial` = the repo is the source of
# truth, change values here (UI changes are reset on restart)
gaz_cena_kwh:
  name: Gaz - cena zmienna brutto
  initial: 0.3115
  min: 0
  max: 2
  step: 0.0001
  mode: box
  unit_of_measurement: zł/kWh
  icon: mdi:cash

gaz_oplata_stala:
  name: Gaz - opłaty stałe brutto
  initial: 80.75
  min: 0
  max: 500
  step: 0.01
  mode: box
  unit_of_measurement: zł/mies.
  icon: mdi:cash-lock

gaz_wsp_konwersji:
  name: Gaz - współczynnik konwersji
  initial: 11.942
  min: 9
  max: 13
  step: 0.001
  mode: box
  unit_of_measurement: kWh/m³
  icon: mdi:swap-horizontal

# Gas meter reading / HA estimate over the same period
