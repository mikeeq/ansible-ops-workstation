---
# Estimated gas energy (kWh) per period, see template.yaml (gaz_*)
gaz_dzis:
  source: sensor.gaz_energia
  cycle: daily
gaz_co_dzis:
  source: sensor.gaz_energia_co
  cycle: daily
gaz_cwu_dzis:
  source: sensor.gaz_energia_cwu
  cycle: daily
gaz_miesiac:
  source: sensor.gaz_energia
  cycle: monthly
gaz_rok:
  source: sensor.gaz_energia
  cycle: yearly

# EV charging (Tesla Wall Connector)
tesla_dzis:
  source: sensor.tesla_wall_connector_energy
  cycle: daily
tesla_miesiac:
  source: sensor.tesla_wall_connector_energy
  cycle: monthly
# Energa billing period (Jan-Feb, Mar-Apr, ...), tariff switched by automation prad_strefa_licznik
tesla_okres:
  source: sensor.tesla_wall_connector_energy
  cron: "0 0 1 */2 *"
  tariffs:
    - l1
    - l2
