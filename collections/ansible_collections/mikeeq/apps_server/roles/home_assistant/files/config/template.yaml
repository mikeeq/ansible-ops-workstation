- sensor:
# yamllint disable-line rule:indentation
  - name: current_state_ch
    state: >
      {% if is_state('binary_sensor.opentherm_dhw_active', 'on') %}
        Water
      {% elif is_state('binary_sensor.opentherm_flame_on', 'on') %}
        CH
      {% else %}
        Idle
      {% endif %}

  - name: piec_sredni_czas_pracy
    unique_id: piec_sredni_czas_pracy
    unit_of_measurement: min
    state: >
      {% set starts = states('sensor.piec_starty_1h') | int(0) %}
      {% set ratio = states('sensor.piec_praca_1h') | float(0) %}
      {{ (ratio * 60 / 100 / starts) | round(1) if starts > 0 else 0 }}

  # Heating control input: Airly sensor Gdynia ul. Kańskiego 5 (5.4 km, nearest), fallbacks: IMGW-PIB station
  # Wejherowo, IMGW weather entity, open-meteo. Airly has a 100 requests/day limit and can go unavailable.
  - name: temperatura_zewnetrzna
    unique_id: temperatura_zewnetrzna
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    state: >
      {% set airly = states('sensor.airly_temperature') %}
      {% set imgw = states('sensor.wejherowo_temperature') %}
      {% set imgw_w = state_attr('weather.wejherowo', 'temperature') %}
      {% if is_number(airly) %}{{ airly | float | round(1) }}
      {% elif is_number(imgw) %}{{ imgw | float }}
      {% elif is_number(imgw_w) %}{{ imgw_w | float }}
      {% else %}{{ state_attr('weather.open_meteo', 'temperature') | float }}{% endif %}
    attributes:
      zrodlo: >
        {% if is_number(states('sensor.airly_temperature')) %}Airly Gdynia Kańskiego
        {% elif is_number(states('sensor.wejherowo_temperature')) %}IMGW Wejherowo
        {% elif is_number(state_attr('weather.wejherowo', 'temperature')) %}IMGW Wejherowo (pogoda)
        {% else %}Open-Meteo{% endif %}
    availability: >
      {{ is_number(states('sensor.airly_temperature'))
         or is_number(states('sensor.wejherowo_temperature'))
         or is_number(state_attr('weather.wejherowo', 'temperature'))
         or is_number(state_attr('weather.open_meteo', 'temperature')) }}

  # Gas estimate (no gas meter in HA): boiler output from OpenTherm modulation. Min ~5.8 kW (34 % of 17 kW),
  # CH max = max_capacity (8 kW after P 12.2), DHW always up to 17 kW.
  - name: piec_moc_cieplna
    unique_id: piec_moc_cieplna
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    icon: mdi:fire
    state: >
      {% if is_state('binary_sensor.piec_palnik', 'on') %}
        {% set pmin = 5.8 %}
        {% set pmax = 17.0 if is_state('binary_sensor.opentherm_dhw_active', 'on')
           else states('sensor.opentherm_max_capacity') | float(8) %}
        {% set mod = states('sensor.opentherm_rel_mod_level') | float(0) %}
        {{ (pmin + ([pmax, pmin] | max - pmin) * mod / 100) | round(2) }}
      {% else %}0{% endif %}

  # Gas input = output / efficiency (CH condensing 0.95, DHW 0.88) x calibration against the gas meter
  - name: gaz_moc_co
    unique_id: gaz_moc_co
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    icon: mdi:radiator
    state: >
      {% if is_state('binary_sensor.opentherm_dhw_active', 'on') %}0
      {% else %}{{ (states('sensor.piec_moc_cieplna') | float(0) / 0.95
                    * states('input_number.gaz_korekta') | float(1)) | round(2) }}{% endif %}

  - name: gaz_moc_cwu
    unique_id: gaz_moc_cwu
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    icon: mdi:water-boiler
    state: >
      {% if is_state('binary_sensor.opentherm_dhw_active', 'on') %}
        {{ (states('sensor.piec_moc_cieplna') | float(0) / 0.88
            * states('input_number.gaz_korekta') | float(1)) | round(2) }}
      {% else %}0{% endif %}

  - name: gaz_moc
    unique_id: gaz_moc
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    icon: mdi:meter-gas
    state: >
      {{ (states('sensor.gaz_moc_co') | float(0) + states('sensor.gaz_moc_cwu') | float(0)) | round(2) }}

  - name: gaz_energia
    unique_id: gaz_energia
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    icon: mdi:meter-gas
    state: >
      {{ (states('sensor.gaz_energia_co') | float(0) + states('sensor.gaz_energia_cwu') | float(0)) | round(3) }}
    availability: >
      {{ is_number(states('sensor.gaz_energia_co')) and is_number(states('sensor.gaz_energia_cwu')) }}

  # For the Energy dashboard (gas in m³, like the meter)
  - name: gaz_zuzycie
    unique_id: gaz_zuzycie
    unit_of_measurement: m³
    device_class: gas
    state_class: total_increasing
    icon: mdi:meter-gas-outline
    state: >
      {{ (states('sensor.gaz_energia') | float(0) / states('input_number.gaz_wsp_konwersji') | float(11.942)) | round(3) }}
    availability: >
      {{ is_number(states('sensor.gaz_energia')) }}

  - name: gaz_koszt_godzina
    unique_id: gaz_koszt_godzina
    unit_of_measurement: zł/h
    state_class: measurement
    icon: mdi:cash-clock
    state: >
      {{ (states('sensor.gaz_moc') | float(0) * states('input_number.gaz_cena_kwh') | float(0)) | round(2) }}

  # Costs: variable part from the utility meters + fixed charges spread over the days
  - name: gaz_koszt_dzis
    unique_id: gaz_koszt_dzis
    unit_of_measurement: zł
    state_class: measurement
    icon: mdi:cash
    state: >
      {{ (states('sensor.gaz_dzis') | float(0) * states('input_number.gaz_cena_kwh') | float(0)
          + states('input_number.gaz_oplata_stala') | float(0) * 12 / 365) | round(2) }}

  - name: gaz_koszt_wczoraj
    unique_id: gaz_koszt_wczoraj
    unit_of_measurement: zł
    icon: mdi:cash-check
    state: >
      {{ (state_attr('sensor.gaz_dzis', 'last_period') | float(0) * states('input_number.gaz_cena_kwh') | float(0)
          + states('input_number.gaz_oplata_stala') | float(0) * 12 / 365) | round(2) }}

  # Fixed charges only for the days the meter has tracked (meters started 2026-10-23, not at the start of the period)
  - name: gaz_koszt_miesiac
    unique_id: gaz_koszt_miesiac
    unit_of_measurement: zł
    state_class: measurement
    icon: mdi:calendar-month
    state: >
      {% set start = as_datetime(state_attr('sensor.gaz_miesiac', 'last_reset'), now()) %}
      {% set days = (now() - start).total_seconds() / 86400 %}
      {{ (states('sensor.gaz_miesiac') | float(0) * states('input_number.gaz_cena_kwh') | float(0)
          + states('input_number.gaz_oplata_stala') | float(0) * 12 / 365 * days) | round(2) }}

  - name: gaz_koszt_rok
    unique_id: gaz_koszt_rok
    unit_of_measurement: zł
    state_class: measurement
    icon: mdi:calendar-range
    state: >
      {% set start = as_datetime(state_attr('sensor.gaz_rok', 'last_reset'), now()) %}
      {% set days = (now() - start).total_seconds() / 86400 %}
      {{ (states('sensor.gaz_rok') | float(0) * states('input_number.gaz_cena_kwh') | float(0)
          + states('input_number.gaz_oplata_stala') | float(0) * 12 / 365 * days) | round(2) }}

  # DHW ~15.9 kWh/day (summer bills) + heating 8.8 kWh per K below a 12 °C balance point (outdoor 24 h mean):
  # 22/23.10 at ~7 °C ~44 kWh, 23/24.10 at ~10.6 °C no heating at all (sun, screed mass). Recalibrate in winter.
  - name: gaz_prognoza_doba
    unique_id: gaz_prognoza_doba
    unit_of_measurement: kWh
    state_class: measurement
    icon: mdi:crystal-ball
    state: >
      {% set t = states('sensor.temperatura_zewnetrzna_srednia_24h') | float(10) %}
      {{ (15.9 + 8.8 * ([12 - t, 0] | max)) | round(1) }}
    attributes:
      koszt: >
        {{ ((15.9 + 8.8 * ([12 - states('sensor.temperatura_zewnetrzna_srednia_24h') | float(10), 0] | max))
            * states('input_number.gaz_cena_kwh') | float(0)
            + states('input_number.gaz_oplata_stala') | float(0) * 12 / 365) | round(2) }}

  # Whole month: tracked energy + model for the rest of the month (and for days before tracking started)
  - name: gaz_prognoza_miesiac
    unique_id: gaz_prognoza_miesiac
    unit_of_measurement: zł
    state_class: measurement
    icon: mdi:crystal-ball
    state: >
      {% set m0 = now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
      {% set m1 = (m0 + timedelta(days=32)).replace(day=1) %}
      {% set start = [as_datetime(state_attr('sensor.gaz_miesiac', 'last_reset'), m0), m0] | max %}
      {% set tracked = (now() - start).total_seconds() / 86400 %}
      {% set untracked = (m1 - m0).total_seconds() / 86400 - tracked %}
      {{ ((states('sensor.gaz_miesiac') | float(0) + untracked * states('sensor.gaz_prognoza_doba') | float(0))
          * states('input_number.gaz_cena_kwh') | float(0)
          + states('input_number.gaz_oplata_stala') | float(0)) | round(0) }}

  - name: climate_switches_on_count
    state: >
      {{ expand('switch.group_ogrzewanie_podlogowe')
      | selectattr('state', 'eq', 'on') | list | count }}

  # Room display names for alerts and the setpoint log (same as room_labels in ui-lovelace.yaml)
  - name: pokoje_etykiety
    unique_id: pokoje_etykiety
    icon: mdi:label-multiple
    state: "11"
    attributes:
      przedpokoj: Korytarz
      lazienka_dol: Łazienka dół
      salon: Salon
      kuchnia: Kuchnia
      sypialnia_dol: Sypialnia dół
      pokoj_julia: Pokój Julia
      sypialnia_gora: Sypialnia
      garderoba: Garderoba
      biuro_miki: Biuro Miki
      lazienka_gora: Łazienka góra
      pokoj_timi: Pokój Timi

- binary_sensor:
  # Holds the last flame state while OpenTherm is unavailable, so restarts are not counted as burner starts
  # yamllint disable-line rule:indentation
  - name: piec_palnik
    unique_id: piec_palnik
    device_class: heat
    state: >
      {% set f = states('binary_sensor.opentherm_flame_on') %}
      {{ f == 'on' if f in ['on', 'off'] else this.state == 'on' }}

  - name: serwerownia_temp_high
    unique_id: serwerownia_temp_high
    # Fires after 5 min sustained to avoid transient spikes triggering alert:
    state: "{{ states('sensor.shelly_htg3_serwerownia_temperature') | float(0) > 35 }}"
    device_class: heat
    delay_on:
      minutes: 5

  - name: any_gate_open
    unique_id: any_gate_open
    state: >
      {{ is_state('binary_sensor.door_state_dwor_brama', 'on')
         or is_state('binary_sensor.door_brama_garaz_opening', 'on') }}
    device_class: opening

  - name: any_alert_active
    unique_id: any_alert_active
    # Used by the dashboard conditional card to show/hide the alert panel
    state: >
      {{ is_state('alert.dwor_brama_otwarta', 'on')
         or is_state('alert.garaz_brama_otwarta', 'on')
         or is_state('alert.serwerownia_temp_wysoka', 'on')
         or is_state('alert.gaz_kotlownia', 'on')
         or is_state('alert.okno_otwarte', 'on')
         or is_state('alert.pokoj_za_zimno', 'on')
         or is_state('alert.pokoj_szybko_sie_nagrzewa', 'on') }}
    device_class: problem

  # Room alerts from sensor.zmiana_temperatury_* (K/h, sensors/temperatura_zmiana.yaml). Only heated rooms – the
  # server room has no thermostat, its window is opened on purpose. Bathrooms: showers and airing, higher limit.
  - name: okno_otwarte
    unique_id: okno_otwarte
    device_class: window
    delay_on:
      minutes: 5
    delay_off:
      minutes: 10
    state: >
      {% set ns = namespace(n=0) %}
      {% for e in integration_entities('derivative') | select('match', 'sensor.zmiana_temperatury_') %}
        {% set limit = -3.0 if 'lazienka' in e else -1.5 %}
        {% if states(e) | float(0) < limit %}{% set ns.n = ns.n + 1 %}{% endif %}
      {% endfor %}
      {{ ns.n > 0 }}
    attributes:
      pokoje: >
        {% set ns = namespace(r=[]) %}
        {% for e in integration_entities('derivative') | select('match', 'sensor.zmiana_temperatury_') %}
          {% set room = e | replace('sensor.zmiana_temperatury_', '') %}
          {% set limit = -3.0 if 'lazienka' in e else -1.5 %}
          {% if states(e) | float(0) < limit %}
            {% set ns.r = ns.r + [(state_attr('sensor.pokoje_etykiety', room) or room) ~ ' ' ~ states(e) ~ ' K/h'] %}
          {% endif %}
        {% endfor %}
        {{ ns.r }}

  - name: pokoj_szybko_sie_nagrzewa
    unique_id: pokoj_szybko_sie_nagrzewa
    device_class: heat
    delay_on:
      minutes: 5
    delay_off:
      minutes: 10
    state: >
      {{ integration_entities('derivative') | select('match', 'sensor.zmiana_temperatury_')
         | reject('search', 'lazienka') | map('states') | map('float', 0) | select('gt', 2.0) | list | count > 0 }}
    attributes:
      pokoje: >
        {% set ns = namespace(r=[]) %}
        {% for e in integration_entities('derivative') | select('match', 'sensor.zmiana_temperatury_')
                    | reject('search', 'lazienka') %}
          {% set room = e | replace('sensor.zmiana_temperatury_', '') %}
          {% if states(e) | float(0) > 2.0 %}
            {% set ns.r = ns.r + [(state_attr('sensor.pokoje_etykiety', room) or room) ~ ' +' ~ states(e) ~ ' K/h'] %}
          {% endif %}
        {% endfor %}
        {{ ns.r }}

  # Heating cannot keep up (or a window stays open): over 1 K below the setpoint for an hour
  - name: pokoj_za_zimno
    unique_id: pokoj_za_zimno
    device_class: cold
    delay_on:
      minutes: 60
    delay_off:
      minutes: 10
    state: >
      {% set ns = namespace(n=0) %}
      {% for c in states.climate | selectattr('state', 'eq', 'heat') %}
        {% if c.attributes.current_temperature | float(99) < c.attributes.temperature | float(0) - 1.0 %}
          {% set ns.n = ns.n + 1 %}
        {% endif %}
      {% endfor %}
      {{ ns.n > 0 }}
    attributes:
      pokoje: >
        {% set ns = namespace(r=[]) %}
        {% for c in states.climate | selectattr('state', 'eq', 'heat') %}
          {% set t = c.attributes.current_temperature | float(99) %}
          {% set s = c.attributes.temperature | float(0) %}
          {% if t < s - 1.0 %}
            {% set ns.r = ns.r + [(state_attr('sensor.pokoje_etykiety', c.object_id) or c.object_id)
                                  ~ ' ' ~ t ~ ' °C (nastawa ' ~ s ~ ')'] %}
          {% endif %}
        {% endfor %}
        {{ ns.r }}


# Garage gate as a real cover: state from the reed switch, and open/close only pulse the relay
# when the gate is in the opposite state – a second tap can no longer close a gate you wanted open.
- cover:
    - name: Brama garażowa
      unique_id: brama_garazowa
      device_class: garage
      state: "{{ 'open' if is_state('binary_sensor.door_brama_garaz_opening', 'on') else 'closed' }}"
      availability: "{{ has_value('binary_sensor.door_brama_garaz_opening') }}"
      open_cover:
        - condition: state
          entity_id: binary_sensor.door_brama_garaz_opening
          state: "off"
        - action: switch.turn_on
          target:
            entity_id: switch.sonoff_4chpror3_garaz_4chpror3_switch_garaz_brama
      close_cover:
        - condition: state
          entity_id: binary_sensor.door_brama_garaz_opening
          state: "on"
        - action: switch.turn_on
          target:
            entity_id: switch.sonoff_4chpror3_garaz_4chpror3_switch_garaz_brama
      stop_cover:
        - action: switch.turn_on
          target:
            entity_id: switch.sonoff_4chpror3_garaz_4chpror3_switch_garaz_brama

- sensor:
    # Battery-powered devices below 20 % or offline (an offline Zigbee sensor usually means a dead battery).
    # Phones, robots and mains-powered Shelly are excluded.
    - name: Słabe baterie
      unique_id: slabe_baterie
      icon: mdi:battery-alert
      state: >
        {% set ids = ['th_salon', 'th_kuchnia', 'th_sypialnia_dol', 'th_lazienka_dol', 'th_przedpokoj',
                      'th_garaz', 'th_ogrod', 'th_pokoj_timi', 'th_lazienka_gora', 'th_garderoba',
                      'shelly_htg3_pokoj_julia', 'door_brama_garaz', 'ikea_5b_kuchnia', 'button_state_dol_1'] %}
        {% set ns = namespace(n=0) %}
        {% for s in ids | map('regex_replace', '^(.*)$', 'sensor.\\1_battery') | map('states') %}
          {% if not s | is_number or s | float < 20 %}{% set ns.n = ns.n + 1 %}{% endif %}
        {% endfor %}
        {{ ns.n }}

# Electricity invoice estimate: Energa G12W prosumer (net-metering 0.8, bank in kWh), 2-month periods Jan-Feb, Mar-Apr...
# Registers lag ~1 day (end of yesterday). Invoice uses hourly-netted sums: factors from FES/00050-51 (import L1 0.85,
# L2 0.965, export 0.96). A surplus in one zone covers a deficit in the other 1:1 (FES/00051).
- triggers:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
    - trigger: state
      entity_id:
        - sensor.energa_30407650_stan_licznika_import_strefa_1
        - sensor.energa_30407650_stan_licznika_import_strefa_2
        - sensor.energa_30407650_stan_licznika_export_strefa_1
        - sensor.energa_30407650_stan_licznika_export_strefa_2
        - input_number.prad_start_pobor_l1
        - input_number.prad_start_pobor_l2
        - input_number.prad_start_oddanie_l1
        - input_number.prad_start_oddanie_l2
        - input_number.prad_magazyn_start_l1
        - input_number.prad_magazyn_start_l2
  conditions:
    - condition: template
      value_template: >
        {{ ['import_strefa_1', 'import_strefa_2', 'export_strefa_1', 'export_strefa_2']
           | map('regex_replace', '^', 'sensor.energa_30407650_stan_licznika_') | map('states')
           | select('is_number') | list | count == 4 }}
  variables:
    p: >
      {% macro bilans(i1, i2, e1, e2, b1, b2) %}
        {% set n1 = i1 * 0.85 %}{% set n2 = i2 * 0.965 %}
        {% set s1 = b1 + e1 * 0.96 * 0.8 - n1 %}{% set s2 = b2 + e2 * 0.96 * 0.8 - n2 %}
        {% if s1 < 0 and s2 > 0 %}{% set c = [s2, -s1] | min %}{% set s1 = s1 + c %}{% set s2 = s2 - c %}
        {% elif s2 < 0 and s1 > 0 %}{% set c = [s1, -s2] | min %}{% set s2 = s2 + c %}{% set s1 = s1 - c %}{% endif %}
        {{ {'n1': n1, 'n2': n2, 'b1': [s1, 0] | max, 'b2': [s2, 0] | max,
            'p1': [-s1, 0] | max, 'p2': [-s2, 0] | max} | to_json }}
      {% endmacro %}
      {% macro tempo(stat, since, days) %}
        {% set cov = state_attr(stat, 'age_coverage_ratio') | float(0) %}
        {{ (states(stat) | float(0) / (7 * cov)) if cov > 0.25 else since / days }}
      {% endmacro %}
      {% set reg = 'sensor.energa_30407650_stan_licznika_' %}
      {% set i1 = [states(reg ~ 'import_strefa_1') | float(0) - states('input_number.prad_start_pobor_l1') | float(0), 0] | max %}
      {% set i2 = [states(reg ~ 'import_strefa_2') | float(0) - states('input_number.prad_start_pobor_l2') | float(0), 0] | max %}
      {% set e1 = [states(reg ~ 'export_strefa_1') | float(0) - states('input_number.prad_start_oddanie_l1') | float(0), 0] | max %}
      {% set e2 = [states(reg ~ 'export_strefa_2') | float(0) - states('input_number.prad_start_oddanie_l2') | float(0), 0] | max %}
      {% set b1 = states('input_number.prad_magazyn_start_l1') | float(0) %}
      {% set b2 = states('input_number.prad_magazyn_start_l2') | float(0) %}
      {% set t = now() %}
      {% set start = t.replace(month=t.month - (t.month - 1) % 2, day=1, hour=0, minute=0, second=0, microsecond=0) %}
      {% set end = (start + timedelta(days=62)).replace(day=1) %}
      {% set read = t.replace(hour=0, minute=0, second=0, microsecond=0) %}
      {% set el = [(read - start).days, 1] | max %}
      {% set rem = [(end - read).days, 0] | max %}
      {% set ri1 = tempo('sensor.prad_7d_pobor_l1', i1, el) | float(0) %}
      {% set ri2 = tempo('sensor.prad_7d_pobor_l2', i2, el) | float(0) %}
      {% set re1 = tempo('sensor.prad_7d_oddanie_l1', e1, el) | float(0) %}
      {% set re2 = tempo('sensor.prad_7d_oddanie_l2', e2, el) | float(0) %}
      {% set fi1 = i1 + ri1 * rem %}{% set fi2 = i2 + ri2 * rem %}
      {% set fe1 = e1 + re1 * rem %}{% set fe2 = e2 + re2 * rem %}
      {% set teraz = bilans(i1, i2, e1, e2, b1, b2) | from_json %}
      {% set f = bilans(fi1, fi2, fe1, fe2, b1, b2) | from_json %}
      {# FES/00051 net prices x VAT: energy + variable network + quality fee per zone, OZE + cogeneration on
         netted import, excise on raw import, fixed: subscription + fixed network + capacity fee per month #}
      {% set vat = 1.23 %}
      {% set energia = (f.p1 * (0.6107 + 0.4017 + 0.0332) + f.p2 * (0.3990 + 0.0851 + 0.0332)) * vat %}
      {% set oze = (f.n1 + f.n2) * (0.0073 + 0.0030) * vat %}
      {% set akcyza = (fi1 + fi2) * 0.005 * vat %}
      {% set stale = 2 * (0.70 + 20.17 + 24.05) * vat %}
      {{ {
        'okres': start.strftime('%d.%m') ~ '–' ~ (end - timedelta(days=1)).strftime('%d.%m.%Y'),
        'dni_uplynelo': el, 'dni_do_konca': rem,
        'pobor_l1': i1 | round(1), 'pobor_l2': i2 | round(1), 'oddanie_l1': e1 | round(1), 'oddanie_l2': e2 | round(1),
        'tempo_pobor': (ri1 + ri2) | round(1), 'tempo_oddanie': (re1 + re2) | round(1),
        'magazyn_teraz_l1': teraz.b1 | round(0), 'magazyn_teraz_l2': teraz.b2 | round(0),
        'magazyn_teraz': (teraz.b1 + teraz.b2) | round(0),
        'prognoza_pobor': (fi1 + fi2) | round(0), 'prognoza_oddanie': (fe1 + fe2) | round(0),
        'magazyn_koniec': (f.b1 + f.b2) | round(0), 'do_zaplaty_kwh': (f.p1 + f.p2) | round(0),
        'koszt_energii': energia | round(2), 'oplata_oze_kog': oze | round(2), 'akcyza': akcyza | round(2),
        'oplaty_stale': stale | round(2), 'faktura': (energia + oze + akcyza + stale) | round(2)
      } }}
  sensor:
    - name: prad_faktura_prognoza
      unique_id: prad_faktura_prognoza
      unit_of_measurement: zł
      state_class: measurement
      icon: mdi:file-document-outline
      state: "{{ p.faktura }}"
      attributes:
        okres: "{{ p.okres }}"
        dni_uplynelo: "{{ p.dni_uplynelo }}"
        dni_do_konca: "{{ p.dni_do_konca }}"
        pobor_l1: "{{ p.pobor_l1 }}"
        pobor_l2: "{{ p.pobor_l2 }}"
        oddanie_l1: "{{ p.oddanie_l1 }}"
        oddanie_l2: "{{ p.oddanie_l2 }}"
        tempo_pobor: "{{ p.tempo_pobor }}"
        tempo_oddanie: "{{ p.tempo_oddanie }}"
        magazyn_teraz_l1: "{{ p.magazyn_teraz_l1 }}"
        magazyn_teraz_l2: "{{ p.magazyn_teraz_l2 }}"
        prognoza_pobor: "{{ p.prognoza_pobor }}"
        prognoza_oddanie: "{{ p.prognoza_oddanie }}"
        magazyn_koniec: "{{ p.magazyn_koniec }}"
        do_zaplaty_kwh: "{{ p.do_zaplaty_kwh }}"
        koszt_energii: "{{ p.koszt_energii }}"
        oplata_oze_kog: "{{ p.oplata_oze_kog }}"
        akcyza: "{{ p.akcyza }}"
        oplaty_stale: "{{ p.oplaty_stale }}"

    - name: prad_magazyn
      unique_id: prad_magazyn
      unit_of_measurement: kWh
      state_class: measurement
      icon: mdi:battery-charging-70
      state: "{{ p.magazyn_teraz }}"

    - name: prad_magazyn_koniec_okresu
      unique_id: prad_magazyn_koniec_okresu
      unit_of_measurement: kWh
      state_class: measurement
      icon: mdi:battery-clock
      state: "{{ p.magazyn_koniec }}"

    - name: prad_okres_pobor
      unique_id: prad_okres_pobor
      unit_of_measurement: kWh
      icon: mdi:transmission-tower-import
      state: "{{ (p.pobor_l1 + p.pobor_l2) | round(1) }}"

    - name: prad_okres_oddanie
      unique_id: prad_okres_oddanie
      unit_of_measurement: kWh
      icon: mdi:transmission-tower-export
      state: "{{ (p.oddanie_l1 + p.oddanie_l2) | round(1) }}"

    - name: prad_do_zaplaty_kwh
      unique_id: prad_do_zaplaty_kwh
      unit_of_measurement: kWh
      icon: mdi:cash-plus
      state: "{{ p.do_zaplaty_kwh }}"

# Energa G12W zone: L2 = 22-06 and 13-15 on weekdays, all day on weekends and holidays (movable feasts not included)
- sensor:
    - name: prad_strefa
      unique_id: prad_strefa
      icon: mdi:clock-time-four-outline
      state: >
        {% set t = now() %}
        {% set swieto = t.strftime('%m-%d') in ['01-01', '01-06', '05-01', '05-03', '08-15', '11-01', '11-11',
                                               '12-24', '12-25', '12-26'] %}
        {{ 'L2' if t.isoweekday() > 5 or swieto or t.hour >= 22 or t.hour < 6 or 13 <= t.hour < 15 else 'L1' }}

    # EV charging (Tesla Wall Connector) in the current billing period, split by zone (utility_meter tesla_okres)
    - name: prad_tesla_okres
      unique_id: prad_tesla_okres
      unit_of_measurement: kWh
      icon: mdi:car-electric
      availability: "{{ has_value('sensor.tesla_okres_l1') and has_value('sensor.tesla_okres_l2') }}"
      state: "{{ (states('sensor.tesla_okres_l1') | float + states('sensor.tesla_okres_l2') | float) | round(1) }}"
      attributes:
        l1: "{{ states('sensor.tesla_okres_l1') | float(0) | round(1) }}"
        l2: "{{ states('sensor.tesla_okres_l2') | float(0) | round(1) }}"
        udzial_poboru: >
          {% set pobor = states('sensor.prad_okres_pobor') | float(0) %}
          {% set ev = states('sensor.tesla_okres_l1') | float(0) + states('sensor.tesla_okres_l2') | float(0) %}
          {{ (100 * ev / pobor) | round(0) if pobor > 0 else none }}
        # Same per-zone rates as prad_faktura_prognoza: what the charging would cost without the energy bank
        wartosc_wg_stawek: >
          {{ (states('sensor.tesla_okres_l1') | float(0) * (0.6107 + 0.4017 + 0.0332) * 1.23
              + states('sensor.tesla_okres_l2') | float(0) * (0.3990 + 0.0851 + 0.0332) * 1.23) | round(2) }}

    # Garage air temperature from the Wall Connector handle; it reports 255 on read errors
    - name: temperatura_garaz
      unique_id: temperatura_garaz
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      availability: "{{ states('sensor.tesla_wall_connector_handle_temperature') | float(255) < 80 }}"
      state: "{{ states('sensor.tesla_wall_connector_handle_temperature') | float }}"

# Next sun event for the Dom badge: sunset while the sun is up, sunrise after dark
- sensor:
    - name: Słońce
      unique_id: slonce_nastepne
      icon: "{{ 'mdi:weather-sunset-down' if is_state('sun.sun', 'above_horizon') else 'mdi:weather-sunset-up' }}"
      availability: "{{ has_value('sensor.sun_next_setting') and has_value('sensor.sun_next_rising') }}"
      state: >
        {%- if is_state('sun.sun', 'above_horizon') -%}
          Zachód {{ as_timestamp(states('sensor.sun_next_setting')) | timestamp_custom('%H:%M') }}
        {%- else -%}
          Wschód {{ as_timestamp(states('sensor.sun_next_rising')) | timestamp_custom('%H:%M') }}
        {%- endif -%}

# Surplus PV power available for the car: 5-min PV mean minus the house load without the car (no live grid meter)
- sensor:
    - name: pv_nadwyzka_auto
      unique_id: pv_nadwyzka_auto
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
      icon: mdi:solar-power-variant
      state: >
        {{ (states('sensor.pv_moc_5min') | float(0) / 1000
            - states('input_number.tesla_slonce_baza') | float(0.8)) | round(2) }}

# Waste collection, Koleczkowo 1 (gmina Szemud, PRSP Sanipor): bins out by 6:00 on the pickup day.
# Dates come from the gmina PDF (https://szemud.pl/gospodarka-odpadami.html, KOLECZKOWO-1_…pdf). Update every January
# with .agents/skills/ha-waste-schedule (scripts/update_waste_schedule.py --year YYYY --write); it rewrites only the
# block between the harmonogram markers. Past the last date the sensors show "brak harmonogramu".
- triggers:
    - trigger: time
      at: "00:00:05"
    - trigger: time
      at: "06:00:00"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
  variables:
    odpady: |-
      {# >>> harmonogram – generated by update_waste_schedule.py #}
      {% set harmonogram = {
        'zmieszane': ['2026-01-05', '2026-01-19', '2026-02-02', '2026-02-16', '2026-03-02', '2026-03-16', '2026-03-30',
                      '2026-04-13', '2026-04-25', '2026-05-11', '2026-05-25', '2026-06-08', '2026-06-22', '2026-07-06',
                      '2026-07-20', '2026-08-03', '2026-08-17', '2026-08-31', '2026-09-14', '2026-09-28', '2026-10-12',
                      '2026-10-26', '2026-11-09', '2026-11-23', '2026-12-07', '2026-12-18', '2026-12-29'],
        'bio': ['2026-01-05', '2026-01-19', '2026-02-02', '2026-02-16', '2026-03-02', '2026-03-16', '2026-03-30',
                '2026-04-13', '2026-04-25', '2026-05-11', '2026-05-25', '2026-06-08', '2026-06-22', '2026-07-06',
                '2026-07-20', '2026-08-03', '2026-08-17', '2026-08-31', '2026-09-14', '2026-09-28', '2026-10-12',
                '2026-10-26', '2026-11-09', '2026-11-23', '2026-12-07', '2026-12-18', '2026-12-29'],
        'papier': ['2026-01-19', '2026-02-16', '2026-03-16', '2026-04-20', '2026-05-18', '2026-06-15', '2026-07-20',
                   '2026-08-17', '2026-09-21', '2026-10-19', '2026-11-16', '2026-12-19'],
        'plastik': ['2026-01-26', '2026-02-23', '2026-03-23', '2026-04-27', '2026-05-25', '2026-06-22', '2026-07-27',
                    '2026-08-24', '2026-09-28', '2026-10-26', '2026-11-23', '2026-12-29'],
        'szklo': ['2026-01-19', '2026-03-16', '2026-05-18', '2026-07-20', '2026-09-21', '2026-11-16'],
      } %}
      {# <<< harmonogram #}
      {% set nazwy = {'zmieszane': 'zmieszane', 'bio': 'bio', 'papier': 'papier', 'plastik': 'plastik', 'szklo': 'szkło'} %}
      {% set dzis = now().date() %}
      {% macro opis(d) %}
        {%- set dt = strptime(d, '%Y-%m-%d').date() %}{% set dni = (dt - dzis).days -%}
        {{- 'dziś' if dni == 0 else 'jutro' if dni == 1
            else ['pon', 'wt', 'śr', 'czw', 'pt', 'sob', 'nd'][dt.weekday()] ~ ' ' ~ dt.day ~ '.' ~ '%02d' | format(dt.month) -}}
      {% endmacro %}
      {% set ns = namespace(out={}, d='9999-12-31', r=[]) %}
      {% for k, v in harmonogram.items() %}
        {% set n = v | select('>=', dzis | string) | first | default('') %}
        {% set ns.out = dict(ns.out, **{k: {'data': n or none, 'dni': (strptime(n, '%Y-%m-%d').date() - dzis).days if n else none,
                                            'opis': opis(n) if n else 'brak harmonogramu'}}) %}
        {% if n and n < ns.d %}{% set ns.d = n %}{% set ns.r = [nazwy[k]] %}{% elif n and n == ns.d %}{% set ns.r = ns.r + [nazwy[k]] %}{% endif %}
      {% endfor %}
      {% set n = ns.d if ns.r else '' %}
      {{ dict(ns.out, najblizszy={'data': n or none, 'dni': (strptime(n, '%Y-%m-%d').date() - dzis).days if n else none,
                                  'opis': opis(n) ~ ': ' ~ ns.r | join(', ') if n else 'brak harmonogramu', 'rodzaje': ns.r}) | to_json }}
  sensor:
    - name: Wywóz śmieci
      unique_id: odpady_najblizszy
      icon: mdi:delete-clock
      state: "{{ odpady.najblizszy.opis }}"
      attributes:
        data: "{{ odpady.najblizszy.data }}"
        dni: "{{ odpady.najblizszy.dni }}"
        rodzaje: "{{ odpady.najblizszy.rodzaje }}"
    - name: Odpady zmieszane
      unique_id: odpady_zmieszane
      icon: mdi:trash-can
      state: "{{ odpady.zmieszane.opis }}"
      attributes:
        data: "{{ odpady.zmieszane.data }}"
        dni: "{{ odpady.zmieszane.dni }}"
    - name: Odpady bio
      unique_id: odpady_bio
      icon: mdi:leaf
      state: "{{ odpady.bio.opis }}"
      attributes:
        data: "{{ odpady.bio.data }}"
        dni: "{{ odpady.bio.dni }}"
    - name: Odpady papier
      unique_id: odpady_papier
      icon: mdi:newspaper-variant-outline
      state: "{{ odpady.papier.opis }}"
      attributes:
        data: "{{ odpady.papier.data }}"
        dni: "{{ odpady.papier.dni }}"
    - name: Odpady plastik
      unique_id: odpady_plastik
      icon: mdi:bottle-soda-classic-outline
      state: "{{ odpady.plastik.opis }}"
      attributes:
        data: "{{ odpady.plastik.data }}"
        dni: "{{ odpady.plastik.dni }}"
    - name: Odpady szkło
      unique_id: odpady_szklo
      icon: mdi:bottle-wine-outline
      state: "{{ odpady.szklo.opis }}"
      attributes:
        data: "{{ odpady.szklo.data }}"
        dni: "{{ odpady.szklo.dni }}"
  # On the day before a pickup and until 6:00 on the day (Dom badge)
  binary_sensor:
    - name: Wystaw kosze
      unique_id: odpady_wystaw_kosze
      icon: mdi:delete-alert
      state: "{{ odpady.najblizszy.dni == 1 or (odpady.najblizszy.dni == 0 and now().hour < 6) }}"
      attributes:
        rodzaje: "{{ odpady.najblizszy.rodzaje }}"
