---
- name: Ensure install dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home_assistant_install_path }}/config"
    - "{{ home_assistant_install_path }}/config/automations"
    - "{{ home_assistant_install_path }}/config/sensors"
    - "{{ home_assistant_install_path }}/config/.storage"
    - "{{ home_assistant_install_path }}/config/mqtt/binary_sensors"
    - "{{ home_assistant_install_path }}/config/mqtt/sensors"
    - "{{ home_assistant_install_path }}/config/mqtt/lights"
    - "{{ home_assistant_install_path }}/config/mqtt/switches"

# with_fileglob copies never delete, so files dropped from the role must be removed explicitly
- name: Remove obsolete config files
  ansible.builtin.file:
    path: "{{ home_assistant_install_path }}/config/{{ item }}"
    state: absent
  loop: "{{ home_assistant_obsolete_config_files }}"

- name: Configure config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../files/config/*

- name: Configure config templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/*
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/config/*"

- name: Configure config/automations
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/automations/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/automations/*
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/config/automations/*"

- name: Configure config/sensors
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/sensors/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/sensors/*
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/config/sensors/*"

- name: Configure config/mqtt/sensors
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/sensors/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/sensors/*

- name: Configure config/mqtt/binary_sensors
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/binary_sensors/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/binary_sensors/*

- name: Configure config/mqtt/lights
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/lights/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/lights/*

- name: Configure config/mqtt/switches
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/switches/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/switches/*

- name: Check that the .storage exists
  ansible.builtin.stat:
    path: "{{ home_assistant_install_path }}/config/.storage/onboarding"
  register: home_assistant_storage_result

- name: Configure .storage
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/.storage"
    mode: "0664"
    backup: true
  when: not home_assistant_storage_result.stat.exists
  with_fileglob:
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/.storage/*"

- name: Configure config init
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/"
    mode: "0664"
    backup: true
    force: false
  with_fileglob:
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/config_init/*"

# Private frontend assets (floor plans) served under /local/; kept out of this public repo
- name: Configure private www assets
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/www/"
    dest: "{{ home_assistant_install_path }}/config/www/"
    mode: "0644"
    directory_mode: "0755"

# Tesla Fleet command signing: HA uses config/tesla_fleet.key if present; the public key must be reachable at
# https://<domain>/.well-known/appspecific/com.tesla.3p.public-key.pem (nginx proxies it to /local/tesla/)
- name: Ensure Tesla Fleet public key dir exists
  ansible.builtin.file:
    path: "{{ home_assistant_install_path }}/config/www/tesla"
    state: directory
    mode: "0755"

- name: Generate Tesla Fleet private key
  ansible.builtin.command:
    cmd: openssl ecparam -name prime256v1 -genkey -noout -out tesla_fleet.key
    chdir: "{{ home_assistant_install_path }}/config"
    creates: "{{ home_assistant_install_path }}/config/tesla_fleet.key"

- name: Restrict Tesla Fleet private key
  ansible.builtin.file:
    path: "{{ home_assistant_install_path }}/config/tesla_fleet.key"
    mode: "0600"

- name: Export Tesla Fleet public key
  ansible.builtin.command:
    cmd: openssl ec -in tesla_fleet.key -pubout -out www/tesla/com.tesla.3p.public-key.pem
    chdir: "{{ home_assistant_install_path }}/config"
    creates: "{{ home_assistant_install_path }}/config/www/tesla/com.tesla.3p.public-key.pem"
