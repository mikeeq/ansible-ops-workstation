---
- name: Ensure install dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ home_assistant_install_path }}/config"
    - "{{ home_assistant_install_path }}/config/automations"
    - "{{ home_assistant_install_path }}/config/sensors"
    - "{{ home_assistant_install_path }}/config/.storage"
    - "{{ home_assistant_install_path }}/config/mqtt/binary_sensors"
    - "{{ home_assistant_install_path }}/config/mqtt/sensors"
    - "{{ home_assistant_install_path }}/config/mqtt/lights"
    - "{{ home_assistant_install_path }}/config/mqtt/switches"

- name: Configure config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../files/config/*

- name: Configure config templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/*
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/config/*"

- name: Configure config/automations
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/automations/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/automations/*
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/config/automations/*"

- name: Configure config/sensors
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/sensors/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/sensors/*
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/config/sensors/*"

- name: Configure config/mqtt/sensors
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/sensors/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/sensors/*

- name: Configure config/mqtt/binary_sensors
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/binary_sensors/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/binary_sensors/*

- name: Configure config/mqtt/lights
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/lights/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/lights/*

- name: Configure config/mqtt/switches
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/switches/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/switches/*

- name: Configure config/mqtt/water_heater
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/mqtt/water_heater/"
    mode: "0664"
    backup: true
  with_fileglob:
    - ../templates/config/mqtt/water_heater/*

- name: Check that the .storage exists
  ansible.builtin.stat:
    path: "{{ home_assistant_install_path }}/config/.storage/onboarding"
  register: home_assistant_storage_result

- name: Configure .storage
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/.storage"
    mode: "0664"
    backup: true
  when: not home_assistant_storage_result.stat.exists
  with_fileglob:
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/.storage/*"

- name: Configure config init
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ home_assistant_install_path }}/config/"
    mode: "0664"
    backup: true
    force: false
  with_fileglob:
    - "{{ playbook_dir }}/../../ansible-ops-private/templates/home-assistant/config_init/*"
