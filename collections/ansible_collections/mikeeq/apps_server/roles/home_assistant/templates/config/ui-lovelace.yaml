  # =====================================================================
  # Domofon: live doorbell with 2-way audio (go2rtc WebRTC backchannel,
  # requires HTTPS), opened from the doorbell notification
  # =====================================================================
  - title: Domofon
    path: domofon
    icon: mdi:doorbell-video
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:advanced-camera-card
            grid_options:
              columns: full
            cameras:
              - camera_entity: camera.reolink_doorbell
                live_provider: go2rtc
                go2rtc:
                  # Frigate camera name differs from the go2rtc restream name
                  stream: reolink_doorbell_restream
                  modes:
                    - webrtc
            live:
              # Hear the visitor right away and keep audio on after talking
              auto_unmute:
                - selected
                - visible
                - microphone
              auto_mute:
                - hidden
              controls:
                builtin: false
              microphone:
                # Reolink doorbell is half-duplex: any backchannel audio (even a
                # muted mic sending silence) mutes its microphone, so connect the
                # mic only while talking and drop it right after
                always_connected: false
                disconnect_seconds: 3
            # Always-visible intercom button bar below the video
            menu:
              style: outside
              position: bottom
              button_size: 64
              buttons:
                microphone:
                  enabled: true
                  # Push-to-talk, matching the half-duplex doorbell
                  type: momentary
                  priority: 100
                mute:
                  enabled: true
                  priority: 90
                fullscreen:
                  priority: 10
{% for b in ['iris', 'cameras', 'live', 'clips', 'snapshots', 'timeline', 'download', 'camera_ui', 'display_mode', 'media_player', 'ptz_home'] %}
                {{ b }}:
                  enabled: false
{% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Furtka
            icon: mdi:gate
          - type: tile
            entity: switch.sonoff_4chpror3_dwor_4chpror3_switch_dwor_furtka
            name: Otwórz furtkę
            icon: mdi:door-open
            state_content: last_changed
            grid_options:
              columns: 6
            tap_action:
              action: toggle
          - type: tile
            entity: switch.sonoff_4chpror3_dwor_4chpror3_switch_dwor_brama
            name: Brama wjazdowa
            icon: mdi:gate
            state_content: last_changed
            grid_options:
              columns: 6
            tap_action:
              action: toggle
          - type: tile
            entity: select.reolink_furtka_play_quick_reply_message
            name: Szybka odpowiedź
            features:
              - type: select-options
          - type: tile
            entity: automation.auto_furtka_dzwonek
            name: Furtka otwiera się na dzwonek
            icon: mdi:doorbell
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: siren.reolink_furtka_siren
            name: Syrena
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.reolink_furtka_visitor
            name: Ostatni dzwonek
            icon: mdi:bell-ring
            state_content: last_changed
            grid_options:
              columns: 6

