            grid_options:
              columns: 3
          - type: tile
            entity: sensor.gaz_koszt_godzina
            name: Koszt teraz
            icon: mdi:cash-clock
            color: deep-orange
            grid_options:
              columns: 3
          - type: tile
            entity: sensor.gaz_koszt_dzis
            name: Koszt dziś
            icon: mdi:cash
            color: deep-orange
            grid_options:
              columns: 3
          - type: tile
            entity: sensor.gaz_koszt_wczoraj
            name: Wczoraj
            icon: mdi:cash-check
            grid_options:
              columns: 3
          - type: tile
            entity: sensor.gaz_koszt_miesiac
            name: Ten miesiąc
            icon: mdi:calendar-month
            grid_options:
              columns: 3
          - type: tile
            entity: sensor.gaz_prognoza_miesiac
            name: Prognoza miesiąca
            icon: mdi:crystal-ball
            color: amber
            grid_options:
              columns: 3
          - type: tile
            entity: sensor.gaz_koszt_rok
            name: Ten rok
            icon: mdi:calendar-range
            grid_options:
              columns: 3
          - type: tile
            entity: sensor.gaz_prognoza_doba
            name: Prognoza doby (pogoda)
            icon: mdi:weather-snowy-heavy
            color: amber
            state_content:
              - state
              - koszt
            grid_options:
              columns: 3
          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Pobór gazu i temperatura (24 h)
              show_states: true
              colorize_states: true
            yaxis:
              - id: kw
                min: 0
                max: 20
                decimals: 0
              - id: temp
                opposite: true
                decimals: 0
            series:
              - entity: sensor.gaz_moc_co
                name: CO
                type: area
                curve: stepline
                color: "#ff7a1a"
                opacity: 0.4
                yaxis_id: kw
              - entity: sensor.gaz_moc_cwu
                name: CWU
                type: area
                curve: stepline
                color: "#3a78c2"
                opacity: 0.4
                yaxis_id: kw
              - entity: sensor.temperatura_zewnetrzna
                name: Na zewnątrz
                type: line
                color: "#9aa4b1"
                stroke_width: 2
                yaxis_id: temp
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            graph_span: 14d
            span:
              end: day
            header:
              show: true
              title: Gaz dziennie (kWh) i temperatura
            yaxis:
              - id: kwh
                min: 0
                decimals: 0
              - id: temp
                opposite: true
                decimals: 0
            series:
              - entity: sensor.gaz_energia_co
                name: CO
                type: column
                color: "#ff7a1a"
                yaxis_id: kwh
                statistics:
                  type: change
                  period: day
                  align: start
              - entity: sensor.gaz_energia_cwu
                name: CWU
                type: column
                color: "#3a78c2"
                yaxis_id: kwh
                statistics:
                  type: change
                  period: day
                  align: start
              - entity: sensor.temperatura_zewnetrzna
                name: Śr. na zewnątrz
                type: line
                color: "#9aa4b1"
                stroke_width: 2
                yaxis_id: temp
                statistics:
                  type: mean
                  period: day
                  align: start
          - type: custom:apexcharts-card
            graph_span: 14d
            span:
              end: day
            header:
              show: true
              title: Koszt dzienny (zł)
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.gaz_koszt_dzis
                name: Koszt
                type: column
                color: "#f2a33a"
                statistics:
                  type: max
                  period: day
                  align: start
          - type: statistics-graph
            title: Gaz miesięcznie (kWh)
            entities:
              - entity: sensor.gaz_energia_co
                name: CO
              - entity: sensor.gaz_energia_cwu
                name: CWU
            stat_types:
              - change
            period: month
            days_to_show: 365
            chart_type: bar
      - type: grid
        cards:
          - type: gauge
            entity: sensor.gaz_moc
            name: Pobór gazu (kW)
            min: 0
            max: 20
            needle: true
            severity:
              green: 0
              yellow: 9
              red: 15
          - type: markdown
            title: Podsumowanie
            content: |
{% raw %}
              {% set k = states('input_number.gaz_wsp_konwersji') | float(11.942) %}
              {% set c = states('input_number.gaz_cena_kwh') | float(0) %}
              {% set d = states('sensor.gaz_dzis') | float(0) %}
              {% set w = state_attr('sensor.gaz_dzis', 'last_period') | float(0) %}
              {% set m = states('sensor.gaz_miesiac') | float(0) %}
              | | kWh | m³ | zł |
              |---|---:|---:|---:|
              | 🔥 Dziś | {{ d | round(1) }} | {{ (d / k) | round(2) }} | {{ states('sensor.gaz_koszt_dzis') }} |
              | ⏪ Wczoraj | {{ w | round(1) }} | {{ (w / k) | round(2) }} | {{ states('sensor.gaz_koszt_wczoraj') }} |
              | 📅 Miesiąc | {{ m | round(0) }} | {{ (m / k) | round(1) }} | {{ states('sensor.gaz_koszt_miesiac') }} |
              | 🔮 Prognoza doby | {{ states('sensor.gaz_prognoza_doba') }} | {{ (states('sensor.gaz_prognoza_doba') | float(0) / k) | round(2) }} | {{ state_attr('sensor.gaz_prognoza_doba', 'koszt') }} |

              Cena {{ c }} zł/kWh ({{ (c * k) | round(2) }} zł/m³), opłaty stałe {{ states('input_number.gaz_oplata_stala') }} zł/mies.
              Szacunek z modulacji OpenTherm (±20–25 %), korekta ×{{ states('input_number.gaz_korekta') }}.
{% endraw %}
          - type: markdown
            title: Faktury myORLEN (W-3.9)
            content: |
              | Okres | m³ | kWh/dobę | Brutto |
              |---|---:|---:|---:|
              | 01.08–30.09.2026 | 81 | 15,9 | 462,71 zł |
              | 24.05–31.07.2026 | 99 | 17,1 | 528,13 zł |

              Lato = sama CWU. Prognoza sezonu: ~1420 m³ / ~6250 zł rocznie.
              Odczyt gazomierza 30.09: 188 m³ – nowy odczyt pozwala ustawić korektę.
          - type: entities
            title: Parametry (zmiana w repo)
            entities:
              - entity: input_number.gaz_cena_kwh
                name: Cena zmienna
                type: simple-entity
                tap_action:
                  action: none
              - entity: input_number.gaz_oplata_stala
                name: Opłaty stałe
                type: simple-entity
                tap_action:
                  action: none
              - entity: input_number.gaz_wsp_konwersji
                name: Współczynnik konwersji
                type: simple-entity
                tap_action:
                  action: none
              - entity: input_number.gaz_korekta
                name: Korekta szacunku
                type: simple-entity
                tap_action:
                  action: none
              - entity: sensor.gaz_zuzycie
                name: Licznik (szacunek)
              - entity: sensor.piec_moc_cieplna
                name: Moc cieplna kotła

