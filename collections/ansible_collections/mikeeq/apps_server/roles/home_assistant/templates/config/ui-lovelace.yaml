{#- Main dashboard, phone-first (Pixel 9 Pro / iPhone 14 Pro). Previous layout: ui-lovelace-old.yaml.
    Ansible renders this file: HA templates would need raw/endraw, none are used here. -#}
{%- set room_labels = {
  'przedpokoj': 'Korytarz', 'lazienka_dol': 'Łazienka dół', 'salon': 'Salon', 'kuchnia': 'Kuchnia',
  'sypialnia_dol': 'Sypialnia dół', 'pokoj_julia': 'Pokój Julia', 'sypialnia_gora': 'Sypialnia',
  'garderoba': 'Garderoba', 'biuro_miki': 'Biuro Miki', 'lazienka_gora': 'Łazienka góra', 'pokoj_timi': 'Pokój Timi'
} -%}
{%- set floor_dol = ['przedpokoj', 'lazienka_dol', 'salon', 'kuchnia', 'sypialnia_dol'] -%}
{%- set hide_unavailable = '[{condition: state, entity: ENTITY, state_not: unavailable}]' -%}
{#- Floor plan label positions (%), from ansible-ops-private/docs/home-assistant/floorplan/positions.yaml -#}
{%- set floorplan = {
  'dol': {
    'rooms': {'kuchnia': [38.1, 15.9], 'salon': [73.5, 29.0], 'przedpokoj': [39.2, 47.2],
              'lazienka_dol': [56.5, 68.7], 'sypialnia_dol': [81.5, 82.2]},
    'sensors': [['sensor.temperatura_garaz', 24.5, 79.9], ['sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_4_temperature', 56.5, 89.7]],
    'humidity': [],
    'garden': [13.0, 11.0],
  },
  'gora': {
    'rooms': {'garderoba': [44.5, 20.5], 'pokoj_julia': [77.1, 17.7], 'sypialnia_gora': [44.8, 46.0],
              'biuro_miki': [21.4, 81.4], 'lazienka_gora': [59.4, 87.9], 'pokoj_timi': [85.3, 83.7]},
    'sensors': [['sensor.shelly_htg3_serwerownia_temperature', 87.3, 43.7]],
    'humidity': [['sensor.shelly_htg3_serwerownia_humidity', 87.3, 48.0]],
    'garden': [13.5, 16.0],
  },
} -%}
{%- set floorplan_ver = 3 -%}
title: Dom
views:
  # =====================================================================
  # Dom: what is used every day, in thumb order (gates first)
  # =====================================================================
  - title: Dom
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.temperatura_zewnetrzna
        name: Na zewnątrz
        show_name: true
        icon: mdi:thermometer
        tap_action:
          action: navigate
          navigation_path: /lovelace/ogrod
      - type: entity
        entity: sensor.temperatura_dom
        name: W domu
        show_name: true
        icon: mdi:home-thermometer
        tap_action:
          action: navigate
          navigation_path: /lovelace/ogrzewanie
      # Sunset while the sun is up, sunrise after dark (template sensor, Koleczkowo)
      - type: entity
        entity: sensor.slonce
        name: Słońce
        show_name: true
        tap_action:
          action: navigate
          navigation_path: /lovelace/ogrod
      # Air quality only when Airly CAQI is medium or worse (> 50)
      - type: entity
        entity: sensor.airly_common_air_quality_index
        name: Powietrze
        show_name: true
        icon: mdi:air-filter
        color: orange
        tap_action:
          action: navigate
          navigation_path: /lovelace/ogrod
        visibility:
          - condition: numeric_state
            entity: sensor.airly_common_air_quality_index
            above: 50
      # Exceptions only – visible when something needs attention
      - type: entity
        entity: cover.brama_garazowa
        name: Brama garażowa
        show_name: true
        color: red
        visibility:
          - condition: state
            entity: cover.brama_garazowa
            state: open
      - type: entity
        entity: automation.auto_furtka_dzwonek
        name: Furtka na dzwonek
        show_name: true
        icon: mdi:doorbell
        color: orange
        visibility:
          - condition: state
            entity: automation.auto_furtka_dzwonek
            state: "on"
      - type: entity
        entity: sensor.slabe_baterie
        name: Czujniki do sprawdzenia
        show_name: true
        color: amber
        tap_action:
          action: navigate
          navigation_path: /lovelace/wiecej
        visibility:
          - condition: numeric_state
            entity: sensor.slabe_baterie
            above: 0
      # Day before a pickup and until 6:00 (template.yaml, Szemud PDF schedule)
      - type: entity
        entity: sensor.wywoz_smieci
        name: Wystaw kosze
        show_name: true
        color: brown
        tap_action:
          action: navigate
          navigation_path: /lovelace/wiecej
        visibility:
          - condition: state
            entity: binary_sensor.wystaw_kosze
            state: "on"
      # IMGW-PIB warning for Wejherowo, only when issued
      - type: entity
        entity: sensor.wejherowo_weather_alert
        name: Ostrzeżenie IMGW
        show_name: true
        icon: mdi:weather-cloudy-alert
        color: red
        tap_action:
          action: navigate
          navigation_path: /lovelace/ogrod
        visibility:
          - condition: state
            entity: sensor.wejherowo_weather_alert
            state_not:
              - no_alert
              - unavailable
              - unknown
    sections:
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.any_alert_active
            state: "on"
        cards:
          - type: heading
            heading: Alerty
            icon: mdi:alert
{% for a in [['gaz_kotlownia', 'Gaz w kotłowni', 'mdi:meter-gas'], ['garaz_brama_otwarta', 'Brama garażowa otwarta', 'mdi:garage-alert'], ['dwor_brama_otwarta', 'Brama wjazdowa otwarta', 'mdi:gate-alert'], ['serwerownia_temp_wysoka', 'Serwerownia za ciepło', 'mdi:thermometer-alert'], ['okno_otwarte', 'Okno/drzwi otwarte?', 'mdi:window-open-variant'], ['pokoj_za_zimno', 'Pokój się wychładza', 'mdi:snowflake-thermometer'], ['pokoj_szybko_sie_nagrzewa', 'Pokój szybko się nagrzewa', 'mdi:thermometer-chevron-up']] %}
          - type: tile
            entity: alert.{{ a[0] }}
            name: {{ a[1] }}
            icon: {{ a[2] }}
            color: red
            visibility:
              - condition: state
                entity: alert.{{ a[0] }}
                state: "on"
{% endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Wejście
            icon: mdi:gate
          - type: tile
            entity: switch.sonoff_4chpror3_dwor_4chpror3_switch_dwor_brama
            name: Brama wjazdowa
            icon: mdi:gate
            state_content: last_changed
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: switch.sonoff_4chpror3_dwor_4chpror3_switch_dwor_furtka
            name: Furtka
            icon: mdi:door
            state_content: last_changed
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: cover.brama_garazowa
            name: Brama garażowa
            state_content:
              - state
              - last_changed
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            # Details of the reed switch (open/closed history, battery) rather than the cover itself
            hold_action:
              action: more-info
              entity: binary_sensor.door_brama_garaz_opening
          - type: tile
            entity: automation.auto_furtka_dzwonek
            name: Furtka na dzwonek
            icon: mdi:doorbell
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: picture-entity
            entity: camera.reolink_doorbell
            name: Furtka
            camera_view: auto
            show_state: false
            grid_options:
              columns: 6
            tap_action:
              action: navigate
              navigation_path: /lovelace/domofon
          - type: picture-entity
            entity: camera.reolink_e1pro_garaz
            name: Brama garażowa
            camera_view: auto
            show_state: false
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Ogrzewanie
            icon: mdi:radiator
            tap_action:
              action: navigate
              navigation_path: /lovelace/ogrzewanie
          - type: tile
            entity: sensor.temperatura_parter
            name: Parter
            icon: mdi:home-floor-0
            grid_options:
              columns: 6
            tap_action:
              action: navigate
              navigation_path: /lovelace/ogrzewanie
          - type: tile
            entity: sensor.temperatura_pietro
            name: Piętro
            icon: mdi:home-floor-1
            grid_options:
              columns: 6
            tap_action:
              action: navigate
              navigation_path: /lovelace/ogrzewanie
          - type: tile
            entity: sensor.opentherm_t_dhw
            name: Ciepła woda
            icon: mdi:water-thermometer
            grid_options:
              columns: 6
          - type: tile
            entity: switch.sonoff_basic_ogrzewanie_pompa_cyrkulacyjna_pompa_cyrkulacyjna
            name: Cyrkulacja
            icon: mdi:sync
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: sensor.gaz_koszt_dzis
            name: Gaz dziś
            icon: mdi:meter-gas
            color: deep-orange
            grid_options:
              columns: 6
            tap_action:
              action: navigate
              navigation_path: /lovelace/gaz
          - type: tile
            entity: sensor.gaz_prognoza_miesiac
            name: Prognoza miesiąca
            icon: mdi:crystal-ball
            color: amber
            grid_options:
              columns: 6
            tap_action:
              action: navigate
              navigation_path: /lovelace/gaz

      - type: grid
        cards:
          - type: heading
            heading: Światła
            icon: mdi:lightbulb-group
{% for group in [
  ['Parter', 'mdi:home-floor-0', [
    ['switch.sonoff_minir2_przedpokoj_minir2_swiatlo_przedpokoj', 'Korytarz', 'mdi:ceiling-light'],
    ['switch.sonoff_minir2_salon_kinkiety_minir2_swiatlo_salon_kinkiety', 'Salon kinkiety', 'mdi:wall-sconce'],
    ['switch.sp_sonoff_salon_switch', 'Salon lampa', 'mdi:floor-lamp-torchiere-variant'],
    ['light.ikea_led_kuchnia_light', 'Kuchnia LED', 'mdi:led-strip', ['light-brightness']],
    ['switch.sonoff_minir2_sypialnia_minir2_swiatlo_sypialnia', 'Sypialnia', 'mdi:ceiling-light'],
    ['switch.sonoff_4chpror3_garaz_4chpror3_swiatlo_garaz_wew', 'Garaż', 'mdi:lightbulb-fluorescent-tube'],
  ]],
  ['Piętro', 'mdi:home-floor-1', [
    ['switch.sonoff_minir2_sypialnia_gora', 'Sypialnia', 'mdi:ceiling-light'],
    ['light.ikea_bulb_lampka_sypialnia_gora_light', 'Sypialnia lampka', 'mdi:lamp', ['light-brightness']],
    ['light.ikea_bulb_biuro_miki_light', 'Biuro lampka', 'mdi:lamp', ['light-brightness']],
    ['light.led_lazienka_gora', 'Łazienka LED', 'mdi:led-strip', ['light-brightness', 'light-color-temp']],
  ]],
  ['Na zewnątrz', 'mdi:tree', [
    ['switch.sonoff_4chpror3_garaz_4chpror3_swiatlo_garaz_zew', 'Nad bramą', 'mdi:coach-lamp-variant'],
    ['switch.sonoff_minir2_drzwi_dwor_minir2_swiatlo_drzwi_dwor', 'Drzwi wejściowe', 'mdi:coach-lamp'],
    ['switch.sonoff_minir2_taras_minir2_swiatlo_taras', 'Taras', 'mdi:coach-lamp-variant'],
  ]],
] %}
          - type: heading
            heading: {{ group[0] }}
            heading_style: subtitle
            icon: {{ group[1] }}
{% for l in group[2] %}
          - type: tile
            entity: {{ l[0] }}
            name: {{ l[1] }}
            icon: {{ l[2] }}
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
{% if l[3] is defined %}
            features:
{% for f in l[3] %}
              - type: {{ f }}
{% endfor %}
{% endif %}
            visibility: {{ hide_unavailable | replace('ENTITY', l[0]) }}
{% endfor %}
{% endfor %}

  # =====================================================================
  # Ogrzewanie: rooms (tap = thermostat dial), boiler controls, today
  # =====================================================================
  - title: Ogrzewanie
    path: ogrzewanie
    icon: mdi:radiator
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.opentherm_cycle_state
        name: Kocioł
        show_name: true
        icon: mdi:water-boiler
      - type: entity
        entity: binary_sensor.opentherm_flame_on
        name: Płomień
        show_name: true
        icon: mdi:fire
        color: deep-orange
        visibility:
          - condition: state
            entity: binary_sensor.opentherm_flame_on
            state: "on"
      - type: entity
        entity: sensor.opentherm_t_boiler
        name: Zasilanie
        show_name: true
      - type: entity
        entity: number.opentherm_ch_target
        name: Krzywa
        show_name: true
        icon: mdi:chart-bell-curve-cumulative
        tap_action:
          action: none
      - type: entity
        entity: sensor.climate_switches_on_count
        name: Strefy grzeją
        show_name: true
        icon: mdi:valve-open
      - type: entity
        entity: sensor.temperatura_zewnetrzna
        name: Na zewnątrz
        show_name: true
        icon: mdi:thermometer
      - type: entity
        entity: input_boolean.ogrzewanie_slonce
        name: Obniżka – słońce
        show_name: true
        color: amber
        tap_action:
          action: none
        visibility:
          - condition: state
            entity: input_boolean.ogrzewanie_slonce
            state: "on"
    sections:
      - type: grid
        cards:
{% for floor in ['dol', 'gora'] %}
          - type: heading
            heading: {{ 'Parter' if floor == 'dol' else 'Piętro' }}
            icon: mdi:home-floor-{{ '0' if floor == 'dol' else '1' }}
            badges:
              - type: entity
                entity: sensor.temperatura_{{ 'parter' if floor == 'dol' else 'pietro' }}
          # Live plan: orange = zone actuator open, tap a temperature = thermostat
          - type: picture-elements
            image: /local/floorplan/{{ floor }}.svg?v={{ floorplan_ver }}
            elements:
{% for i in home_assistant_config.climate if i.name in floorplan[floor].rooms %}
              - type: image
                entity: {{ i.switch }}
                image: /local/floorplan/{{ floor }}_off.svg?v={{ floorplan_ver }}
                state_image:
                  "on": /local/floorplan/{{ floor }}_{{ i.name }}.svg?v={{ floorplan_ver }}
                tap_action:
                  action: none
                hold_action:
                  action: none
                style:
                  left: 50%
                  top: 50%
                  width: 100%
                  pointer-events: none
{% endfor %}
{% for i in home_assistant_config.climate if i.name in floorplan[floor].rooms %}
{% set pos = floorplan[floor].rooms[i.name] %}
              - type: state-label
                entity: climate.{{ i.name }}
                attribute: current_temperature
                suffix: "°"
                tap_action:
                  action: more-info
                style:
                  left: {{ pos[0] }}%
                  top: {{ pos[1] }}%
                  color: white
                  font-size: 16px
                  font-weight: 700
                  text-shadow: 0 0 3px black, 0 0 6px black
              - type: state-label
                entity: climate.{{ i.name }}
                attribute: temperature
                prefix: "→ "
                suffix: "°"
                tap_action:
                  action: more-info
                style:
                  left: {{ pos[0] }}%
                  top: {{ (pos[1] + 4.3) | round(1) }}%
                  color: var(--secondary-text-color)
                  font-size: 11px
              - type: state-label
                entity: sensor.{{ i.sensor_type | default('th') }}_{{ i.name }}_humidity
                prefix: "💧 "
                tap_action:
                  action: more-info
                style:
                  left: {{ pos[0] }}%
                  top: {{ (pos[1] + 7.8) | round(1) }}%
                  color: "#8ab4f8"
                  font-size: 11px
{% endfor %}
{% for s in floorplan[floor].sensors %}
              - type: state-label
                entity: {{ s[0] }}
                tap_action:
                  action: more-info
                style:
                  left: {{ s[1] }}%
                  top: {{ s[2] }}%
                  color: white
                  font-size: 13px
                  font-weight: 600
                  text-shadow: 0 0 3px black, 0 0 6px black
{% endfor %}
{% for s in floorplan[floor].humidity %}
              - type: state-label
                entity: {{ s[0] }}
                prefix: "💧 "
                tap_action:
                  action: more-info
                style:
                  left: {{ s[1] }}%
                  top: {{ s[2] }}%
                  color: "#8ab4f8"
                  font-size: 11px
{% endfor %}
{% for g in [['sensor.th_ogrod_temperature', 'state_not'], ['sensor.temperatura_zewnetrzna', 'state']] %}
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.th_ogrod_temperature
                    {{ g[1] }}:
                      - unavailable
                      - unknown
                elements:
                  - type: state-label
                    entity: {{ g[0] }}
                    prefix: "🌳 "
                    tap_action:
                      action: more-info
                    style:
                      left: {{ floorplan[floor].garden[0] }}%
                      top: {{ floorplan[floor].garden[1] }}%
                      color: white
                      font-size: 13px
                      font-weight: 600
                      text-shadow: 0 0 3px black, 0 0 6px black
{% endfor %}
{% if floor == 'dol' %}
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.opentherm_flame_on
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:fire
                    entity: binary_sensor.opentherm_flame_on
                    style:
                      left: 56%
                      top: 95%
                      color: "#ff7a1a"
                      "--mdc-icon-size": 22px
{% endif %}
{% for i in home_assistant_config.climate if (i.floor | default('dol' if i.name in floor_dol else 'gora')) == floor %}
          - type: tile
            entity: climate.{{ i.name }}
            name: {{ i.label | default(room_labels[i.name] | default(i.name)) }}
            state_content:
              - current_temperature
              - temperature
            grid_options:
              columns: 6
{% endfor %}
{% endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Kocioł
            icon: mdi:water-boiler
          # Status only – boiler setpoints and CO/CWU are managed by automations, not from the dashboard
          - type: tile
            entity: sensor.opentherm_t_set_effective
            name: Nastawa zasilania
            icon: mdi:radiator
            color: deep-orange
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.opentherm_t_dhw
            name: Ciepła woda
            icon: mdi:water-thermometer
            color: blue
            grid_options:
              columns: 6
          # Set by ogrzewanie_krzywa_grzewcza from the IMGW outdoor temperature
          - type: tile
            entity: number.opentherm_ch_target
            name: Nastawa z krzywej
            icon: mdi:chart-bell-curve-cumulative
            color: deep-orange
            grid_options:
              columns: 6
            tap_action:
              action: none
          - type: tile
            entity: sensor.temperatura_zewnetrzna_srednia_24h
            name: Śr. 24 h (sezon)
            icon: mdi:thermometer-auto
            grid_options:
              columns: 6
{% for sw in [['switch.opentherm_ch_enable', 'CO', 'mdi:radiator'], ['switch.opentherm_dhw_enable', 'CWU', 'mdi:water-boiler']] %}
          - type: tile
            entity: {{ sw[0] }}
            name: {{ sw[1] }}
            icon: {{ sw[2] }}
            grid_options:
              columns: 6
            tap_action:
              action: none
            icon_tap_action:
              action: none
            hold_action:
              action: none
{% endfor %}
          - type: tile
            entity: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
            name: Podłogówka
            icon: mdi:heating-coil
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.imou_gas_detector_kotlownia
            name: Czujnik gazu
            icon: mdi:meter-gas
            grid_options:
              columns: 6
          - type: tile
            entity: switch.sonoff_basic_ogrzewanie_pompa_cyrkulacyjna_pompa_cyrkulacyjna
            name: Cyrkulacja
            icon: mdi:water-sync
            grid_options:
              columns: 6
          - type: tile
            entity: number.opentherm_t_dhw_set
            name: Nastawa CWU
            icon: mdi:water-boiler
            color: blue
            grid_options:
              columns: 6
            tap_action:
              action: none

      - type: grid
        cards:
          - type: heading
            heading: Dziś
            icon: mdi:chart-timeline-variant
            tap_action:
              action: navigate
              navigation_path: /lovelace/kotlownia
          - type: tile
            entity: sensor.opentherm_t_boiler
            name: Zasilanie kotła
            icon: mdi:thermometer-high
            features_position: inline
            features:
              - type: trend-graph
                hours_to_show: 6
          - type: tile
            entity: sensor.piec_starty_1h
            name: Starty / 1 h
            icon: mdi:counter
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.piec_sredni_czas_pracy
            name: Śr. czas pracy
            icon: mdi:timer-outline
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.piec_starty_24h
            name: Starty / 24 h
            icon: mdi:counter
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.piec_praca_1h
            name: Praca palnika / 1 h
            icon: mdi:fire-circle
            grid_options:
              columns: 6
          # Condensing works below ~55 °C exhaust
          - type: tile
            entity: sensor.opentherm_t_exhaust
            name: Spaliny (kondensacja < 55 °C)
            icon: mdi:smoke
            features_position: inline
            features:
              - type: trend-graph
                hours_to_show: 6
          - type: history-graph
            hours_to_show: 6
            entities:
              - entity: binary_sensor.opentherm_flame_on
                name: Płomień
              - entity: binary_sensor.opentherm_dhw_active
                name: CWU
              - entity: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
                name: Podłogówka

      # Mould risk: long periods above 65 % (bathrooms 75 % – showers spike them); 7-day hourly means
      - type: grid
        cards:
          - type: heading
            heading: Wilgotność
            icon: mdi:water-percent
            badges:
              - type: entity
                entity: sensor.wejherowo_humidity
                name: Na zewnątrz
                show_name: true
          - type: entity-filter
            show_empty: false
            conditions:
              - condition: numeric_state
                above: 65
            entities:
{% for i in home_assistant_config.climate %}
              - entity: sensor.{{ i.sensor_type | default('th') }}_{{ i.name }}_humidity
                name: {{ i.label | default(room_labels[i.name] | default(i.name)) }}
{% if 'lazienka' in i.name %}
                conditions:
                  - condition: numeric_state
                    above: 75
{% endif %}
{% endfor %}
            card:
              type: entities
