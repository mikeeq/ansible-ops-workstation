        column_span: 3
        cards:
          # Supply = solid, return = dashed (same colour per circuit); modulation as a shaded area on the right axis
          - type: custom:apexcharts-card
            graph_span: 6h
            header:
              show: true
              title: Kocioł i grupy pompowe
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 420
              legend:
                show: true
                position: bottom
              tooltip:
                shared: true
                x:
                  format: HH:mm
              grid:
                strokeDashArray: 3
            all_series_config:
              stroke_width: 2
              curve: smooth
              group_by:
                func: avg
                duration: 2min
            series:
              - entity: sensor.opentherm_rel_mod_level
                name: Modulacja
                yaxis_id: mod
                type: area
                curve: stepline
                color: "#9e9e9e"
                opacity: 0.2
                stroke_width: 1
              - entity: sensor.opentherm_t_boiler
                name: TB (kocioł)
                yaxis_id: temp
                color: "#e53935"
                stroke_width: 3
              - entity: sensor.opentherm_t_set_effective
                name: Nastawa
                yaxis_id: temp
                color: "#ff9800"
                curve: stepline
                stroke_dash: 6
                group_by:
                  func: last
                  duration: 2min
              - entity: sensor.opentherm_t_exhaust
                name: Spaliny
                yaxis_id: temp
                color: "#8e24aa"
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_1_temperature
                name: Podłoga Z
                yaxis_id: temp
                color: "#1e88e5"
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_2_temperature
                name: Podłoga P
                yaxis_id: temp
                color: "#1e88e5"
                stroke_dash: 4
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_3_temperature
                name: Grupy Z
                yaxis_id: temp
                color: "#43a047"
            yaxis:
              - id: temp
                min: ~20
                max: ~70
                decimals: 0
                apex_config:
                  tickAmount: 5
                  title:
                    text: °C
              - id: mod
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  tickAmount: 5
                  title:
                    text: Modulacja %
      - type: grid
