{% raw %}
              {% set p = 'sensor.prad_faktura_prognoza' %}
              **Okres {{ state_attr(p, 'okres') }}** – minęło {{ state_attr(p, 'dni_uplynelo') }} dni, zostało {{ state_attr(p, 'dni_do_konca') }}.

              | | L1 dzień | L2 noc/weekend |
              |---|---:|---:|
              | ⬇️ Pobór | {{ state_attr(p, 'pobor_l1') }} | {{ state_attr(p, 'pobor_l2') }} |
              | ⬆️ Oddanie | {{ state_attr(p, 'oddanie_l1') }} | {{ state_attr(p, 'oddanie_l2') }} |
              | 🔋 Magazyn teraz | {{ state_attr(p, 'magazyn_teraz_l1') }} | {{ state_attr(p, 'magazyn_teraz_l2') }} |

              Tempo: pobór {{ state_attr(p, 'tempo_pobor') }} kWh/d, oddanie {{ state_attr(p, 'tempo_oddanie') }} kWh/d →
              do końca okresu pobór {{ state_attr(p, 'prognoza_pobor') }} kWh, oddanie {{ state_attr(p, 'prognoza_oddanie') }} kWh,
