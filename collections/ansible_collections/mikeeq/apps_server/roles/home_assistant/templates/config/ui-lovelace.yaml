              | Składnik (brutto) | zł |
              |---|---:|
              | Energia ponad magazyn ({{ state_attr(p, 'do_zaplaty_kwh') }} kWh) | {{ state_attr(p, 'koszt_energii') }} |
              | OZE + kogeneracja | {{ state_attr(p, 'oplata_oze_kog') }} |
