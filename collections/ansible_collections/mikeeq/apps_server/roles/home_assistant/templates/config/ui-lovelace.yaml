{#- Main dashboard, phone-first (Pixel 9 Pro / iPhone 14 Pro). Previous layout: ui-lovelace-old.yaml.
    Ansible renders this file: HA templates would need raw/endraw, none are used here. -#}
{%- set room_labels = {
  'przedpokoj': 'Korytarz', 'lazienka_dol': 'Łazienka dół', 'salon': 'Salon', 'kuchnia': 'Kuchnia',
  'sypialnia_dol': 'Sypialnia dół', 'pokoj_julia': 'Pokój Julia', 'sypialnia_gora': 'Sypialnia',
  'garderoba': 'Garderoba', 'biuro_miki': 'Biuro Miki', 'lazienka_gora': 'Łazienka góra', 'pokoj_timi': 'Pokój Timi'
} -%}
{%- set floor_dol = ['przedpokoj', 'lazienka_dol', 'salon', 'kuchnia', 'sypialnia_dol'] -%}
{%- set hide_unavailable = '[{condition: state, entity: ENTITY, state_not: unavailable}]' -%}
{#- Floor plan label positions (%), from ansible-ops-private/docs/home-assistant/floorplan/positions.yaml -#}
{%- set floorplan = {
  'dol': {
    'rooms': {'kuchnia': [39.0, 12.6], 'salon': [73.5, 26.2], 'przedpokoj': [39.2, 47.6],
              'lazienka_dol': [56.7, 67.5], 'sypialnia_dol': [81.7, 81.6]},
    'sensors': [['sensor.th_garaz_temperature', 24.0, 79.1], ['sensor.opentherm_ds18b20', 56.0, 89.3]],
  },
  'gora': {
    'rooms': {'garderoba': [41.5, 20.5], 'pokoj_julia': [77.1, 17.7], 'sypialnia_gora': [44.8, 46.0],
              'biuro_miki': [21.4, 81.4], 'lazienka_gora': [59.4, 87.9], 'pokoj_timi': [85.3, 83.7]},
    'sensors': [['sensor.shelly_htg3_serwerownia_temperature', 87.3, 43.7]],
  },
} -%}
{%- set floorplan_ver = 1 -%}
title: Dom
views:
  # =====================================================================
  # Dom: what is used every day, in thumb order (gates first)
  # =====================================================================
  - title: Dom
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: weather.open_meteo
        name: Na zewnątrz
        show_name: true
        state_content: temperature
        tap_action:
          action: navigate
          navigation_path: /lovelace/ogrod
      - type: entity
        entity: sensor.temperatura_dom
        name: W domu
        show_name: true
        icon: mdi:home-thermometer
        tap_action:
          action: navigate
          navigation_path: /lovelace/ogrzewanie
      # Exceptions only – visible when something needs attention
      - type: entity
        entity: cover.brama_garazowa
        name: Brama garażowa
        show_name: true
        color: red
        visibility:
          - condition: state
            entity: cover.brama_garazowa
            state: open
      - type: entity
        entity: automation.auto_furtka_dzwonek
        name: Furtka na dzwonek
        show_name: true
        icon: mdi:doorbell
        color: orange
        visibility:
          - condition: state
            entity: automation.auto_furtka_dzwonek
            state: "on"
      - type: entity
        entity: sensor.slabe_baterie
        name: Czujniki do sprawdzenia
        show_name: true
        color: amber
        tap_action:
          action: navigate
          navigation_path: /lovelace/wiecej
        visibility:
          - condition: numeric_state
            entity: sensor.slabe_baterie
            above: 0
    sections:
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.any_alert_active
            state: "on"
        cards:
          - type: heading
            heading: Alerty
            icon: mdi:alert
{% for a in [['gaz_kotlownia', 'Gaz w kotłowni', 'mdi:meter-gas'], ['garaz_brama_otwarta', 'Brama garażowa otwarta', 'mdi:garage-alert'], ['dwor_brama_otwarta', 'Brama wjazdowa otwarta', 'mdi:gate-alert'], ['serwerownia_temp_wysoka', 'Serwerownia za ciepło', 'mdi:thermometer-alert']] %}
          - type: tile
            entity: alert.{{ a[0] }}
            name: {{ a[1] }}
            icon: {{ a[2] }}
            color: red
            visibility:
              - condition: state
                entity: alert.{{ a[0] }}
                state: "on"
{% endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Wejście
            icon: mdi:gate
          - type: tile
            entity: switch.sonoff_4chpror3_dwor_4chpror3_switch_dwor_brama
            name: Brama wjazdowa
            icon: mdi:gate
            state_content: last_changed
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: switch.sonoff_4chpror3_dwor_4chpror3_switch_dwor_furtka
            name: Furtka
            icon: mdi:door
            state_content: last_changed
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: cover.brama_garazowa
            name: Brama garażowa
            state_content:
              - state
              - last_changed
            features_position: inline
            features:
              - type: cover-open-close
          - type: tile
            entity: automation.auto_furtka_dzwonek
            name: Furtka otwiera się na dzwonek
            icon: mdi:doorbell
            features_position: inline
            features:
              - type: toggle
          - type: picture-entity
            entity: camera.reolink_doorbell
            name: Furtka
            camera_view: auto
            show_state: false

      - type: grid
        cards:
          - type: heading
            heading: Ogrzewanie
            icon: mdi:radiator
            tap_action:
              action: navigate
              navigation_path: /lovelace/ogrzewanie
          - type: tile
            entity: sensor.temperatura_parter
            name: Parter
            icon: mdi:home-floor-0
            grid_options:
              columns: 6
            tap_action:
              action: navigate
              navigation_path: /lovelace/ogrzewanie
          - type: tile
            entity: sensor.temperatura_pietro
            name: Piętro
            icon: mdi:home-floor-1
            grid_options:
              columns: 6
            tap_action:
              action: navigate
              navigation_path: /lovelace/ogrzewanie
          - type: tile
            entity: sensor.opentherm_t_dhw
            name: Ciepła woda
            icon: mdi:water-thermometer
            grid_options:
              columns: 6
          - type: tile
            entity: switch.sonoff_basic_ogrzewanie_pompa_cyrkulacyjna_pompa_cyrkulacyjna
            name: Cyrkulacja
            icon: mdi:sync
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info

      - type: grid
        cards:
          - type: heading
            heading: Światła
            icon: mdi:lightbulb-group
{% for l in [
  ['switch.sonoff_minir2_przedpokoj_minir2_swiatlo_przedpokoj', 'Korytarz', 'mdi:ceiling-light'],
  ['switch.sonoff_minir2_salon_kinkiety_minir2_swiatlo_salon_kinkiety', 'Salon kinkiety', 'mdi:wall-sconce'],
  ['switch.sp_sonoff_salon_switch', 'Salon lampa', 'mdi:floor-lamp-torchiere-variant'],
  ['light.ikea_led_kuchnia_light', 'Kuchnia LED', 'mdi:led-strip', ['light-brightness']],
  ['switch.sonoff_minir2_sypialnia_minir2_swiatlo_sypialnia', 'Sypialnia dół', 'mdi:ceiling-light'],
  ['switch.sonoff_minir2_sypialnia_gora', 'Sypialnia', 'mdi:ceiling-light'],
  ['light.ikea_bulb_lampka_sypialnia_gora_light', 'Sypialnia lampka', 'mdi:lamp', ['light-brightness']],
  ['light.ikea_bulb_biuro_miki_light', 'Biuro lampka', 'mdi:lamp', ['light-brightness']],
  ['light.led_lazienka_gora', 'Łazienka LED', 'mdi:led-strip', ['light-brightness', 'light-color-temp']],
] %}
          - type: tile
            entity: {{ l[0] }}
            name: {{ l[1] }}
            icon: {{ l[2] }}
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
{% if l[3] is defined %}
            features:
{% for f in l[3] %}
              - type: {{ f }}
{% endfor %}
{% endif %}
            visibility: {{ hide_unavailable | replace('ENTITY', l[0]) }}
{% endfor %}
          - type: heading
            heading: Na zewnątrz
            heading_style: subtitle
{% for l in [
  ['switch.sonoff_4chpror3_garaz_4chpror3_swiatlo_garaz_zew', 'Nad bramą', 'mdi:coach-lamp-variant'],
  ['switch.sonoff_minir2_drzwi_dwor_minir2_swiatlo_drzwi_dwor', 'Drzwi wejściowe', 'mdi:coach-lamp'],
  ['switch.sonoff_minir2_taras_minir2_swiatlo_taras', 'Taras', 'mdi:coach-lamp-variant'],
  ['switch.sonoff_4chpror3_garaz_4chpror3_swiatlo_garaz_wew', 'Garaż', 'mdi:lightbulb-fluorescent-tube'],
] %}
          - type: tile
            entity: {{ l[0] }}
            name: {{ l[1] }}
            icon: {{ l[2] }}
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            visibility: {{ hide_unavailable | replace('ENTITY', l[0]) }}
{% endfor %}

  # =====================================================================
  # Ogrzewanie: rooms (tap = thermostat dial), boiler controls, today
  # =====================================================================
  - title: Ogrzewanie
    path: ogrzewanie
    icon: mdi:radiator
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.opentherm_cycle_state
        name: Kocioł
        show_name: true
        icon: mdi:water-boiler
      - type: entity
        entity: binary_sensor.opentherm_flame_on
        name: Płomień
        show_name: true
        icon: mdi:fire
        color: deep-orange
        visibility:
          - condition: state
            entity: binary_sensor.opentherm_flame_on
            state: "on"
      - type: entity
        entity: sensor.opentherm_t_boiler
        name: Zasilanie
        show_name: true
      - type: entity
        entity: sensor.climate_switches_on_count
        name: Strefy grzeją
        show_name: true
        icon: mdi:valve-open
      - type: entity
        entity: weather.open_meteo
        name: Na zewnątrz
        show_name: true
        state_content: temperature
    sections:
      - type: grid
        cards:
{% for floor in ['dol', 'gora'] %}
          - type: heading
            heading: {{ 'Parter' if floor == 'dol' else 'Piętro' }}
            icon: mdi:home-floor-{{ '0' if floor == 'dol' else '1' }}
            badges:
              - type: entity
                entity: sensor.temperatura_{{ 'parter' if floor == 'dol' else 'pietro' }}
          # Live plan: orange = zone actuator open, tap a temperature = thermostat
          - type: picture-elements
            image: /local/floorplan/{{ floor }}.svg?v={{ floorplan_ver }}
            elements:
{% for i in home_assistant_config.climate if i.name in floorplan[floor].rooms %}
              - type: image
                entity: {{ i.switch }}
                image: /local/floorplan/{{ floor }}_off.svg?v={{ floorplan_ver }}
                state_image:
                  "on": /local/floorplan/{{ floor }}_{{ i.name }}.svg?v={{ floorplan_ver }}
                tap_action:
                  action: none
                hold_action:
                  action: none
                style:
                  left: 50%
                  top: 50%
                  width: 100%
                  pointer-events: none
{% endfor %}
{% for i in home_assistant_config.climate if i.name in floorplan[floor].rooms %}
{% set pos = floorplan[floor].rooms[i.name] %}
              - type: state-label
                entity: climate.{{ i.name }}
                attribute: current_temperature
                suffix: "°"
                tap_action:
                  action: more-info
                style:
                  left: {{ pos[0] }}%
                  top: {{ pos[1] }}%
                  color: white
                  font-size: 15px
                  font-weight: 600
                  padding: 2px 10px
                  border-radius: 14px
                  background: rgba(0, 0, 0, 0.55)
              - type: state-label
                entity: climate.{{ i.name }}
                attribute: temperature
                prefix: "→ "
                suffix: "°"
                tap_action:
                  action: more-info
                style:
                  left: {{ pos[0] }}%
                  top: {{ (pos[1] + 5) | round(1) }}%
                  color: var(--secondary-text-color)
                  font-size: 11px
{% endfor %}
{% for s in floorplan[floor].sensors %}
              - type: state-label
                entity: {{ s[0] }}
                tap_action:
                  action: more-info
                style:
                  left: {{ s[1] }}%
                  top: {{ s[2] }}%
                  color: white
                  font-size: 13px
                  padding: 2px 8px
                  border-radius: 12px
                  background: rgba(0, 0, 0, 0.55)
{% endfor %}
{% if floor == 'dol' %}
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.opentherm_flame_on
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:fire
                    entity: binary_sensor.opentherm_flame_on
                    style:
                      left: 56%
                      top: 95%
                      color: "#ff7a1a"
                      "--mdc-icon-size": 22px
{% endif %}
{% for i in home_assistant_config.climate if (i.floor | default('dol' if i.name in floor_dol else 'gora')) == floor %}
          - type: tile
            entity: climate.{{ i.name }}
            name: {{ i.label | default(room_labels[i.name] | default(i.name)) }}
            state_content:
              - current_temperature
              - temperature
            grid_options:
              columns: 6
{% endfor %}
{% endfor %}

      - type: grid
        cards:
          - type: heading
            heading: Kocioł
            icon: mdi:water-boiler
          - type: tile
            entity: number.opentherm_ch_target
            name: Nastawa CO
            icon: mdi:radiator
            color: deep-orange
            grid_options:
              columns: 6
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.opentherm_t_dhw_set
            name: Nastawa CWU
            icon: mdi:water-boiler
            color: blue
            grid_options:
              columns: 6
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: switch.opentherm_ch_enable
            name: CO
            icon: mdi:radiator
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: switch.opentherm_dhw_enable
            name: CWU
            icon: mdi:water-thermometer
            grid_options:
              columns: 6
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
            name: Podłogówka
            icon: mdi:heating-coil
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.imou_gas_detector_kotlownia
            name: Czujnik gazu
            icon: mdi:meter-gas
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Dziś
            icon: mdi:chart-timeline-variant
            tap_action:
              action: navigate
              navigation_path: /lovelace/kotlownia
          - type: tile
            entity: sensor.opentherm_t_boiler
            name: Zasilanie kotła
            icon: mdi:thermometer-high
            features_position: inline
            features:
              - type: trend-graph
                hours_to_show: 6
          - type: tile
            entity: sensor.piec_starty_1h
            name: Starty / 1 h
            icon: mdi:counter
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.piec_sredni_czas_pracy
            name: Śr. czas pracy
            icon: mdi:timer-outline
            grid_options:
              columns: 6
          - type: history-graph
            hours_to_show: 6
            entities:
              - entity: binary_sensor.opentherm_flame_on
                name: Płomień
              - entity: binary_sensor.opentherm_dhw_active
                name: CWU
              - entity: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
                name: Podłogówka

  # Boiler room details for tuning – not in the tab bar, opened from "Dziś"
  - title: Kotłownia
    path: kotlownia
    subview: true
    back_path: /lovelace/ogrzewanie
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:apexcharts-card
            graph_span: 6h
            header:
              show: true
              title: Kocioł i grupy pompowe
            series:
              - entity: binary_sensor.opentherm_flame_on
                name: Płomień
                yaxis_id: "2"
                type: line
                curve: stepline
                transform: "return x === 'on' ? 1 : 0;"
              - entity: sensor.opentherm_rel_mod_level
                name: Modulacja
                yaxis_id: "1"
              - entity: sensor.opentherm_t_boiler
                name: Zasilanie
                yaxis_id: "1"
              - entity: sensor.opentherm_t_set_effective
                name: Nastawa
                yaxis_id: "1"
                curve: stepline
              - entity: sensor.climate_switches_on_count
                name: Strefy
                yaxis_id: "2"
                type: line
                curve: stepline
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_1_temperature
                name: Podłoga Z
                yaxis_id: "1"
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_2_temperature
                name: Podłoga P
                yaxis_id: "1"
            yaxis:
              - id: "1"
                min: 0
                max: 80
              - id: "2"
                opposite: true
                min: 0
                max: 12
      - type: grid
        cards:
          - type: heading
            heading: Anty-taktowanie
            icon: mdi:sine-wave
          - type: entities
            entities:
              - entity: switch.opentherm_anti_cycle
                name: Anty-taktowanie
              - entity: number.opentherm_stop_above
                name: Stop powyżej nastawy
              - entity: number.opentherm_start_below
                name: Start poniżej nastawy
              - entity: number.opentherm_max_rel_mod_level
                name: Maks. modulacja
              - entity: sensor.opentherm_cycle_state
                name: Faza cyklu
              - entity: sensor.piec_starty_24h
                name: Starty / 24 h
              - entity: sensor.piec_praca_1h
                name: Praca palnika / 1 h
              - entity: sensor.opentherm_t_exhaust
                name: Spaliny
              - entity: sensor.opentherm_ds18b20
                name: Temperatura w kotłowni
      - type: grid
        cards:
          - type: heading
            heading: Grupy pompowe
            icon: mdi:pump
          - type: entities
            entities:
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_1_temperature
                name: Podłoga zasilanie
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_2_temperature
                name: Podłoga powrót
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_3_temperature
                name: Grzejniki zasilanie
              - entity: sensor.sonoff_4chpror3_ogrzewanie_piec_ds18b20_4_temperature
                name: Grzejniki powrót
              - entity: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_grzejniki
                name: Pompa grzejniki
              - entity: switch.sonoff_4chpror3_ogrzewanie_piec_mieszacz_grzejniki_otwieranie
                name: Mieszacz grzejniki – otwieranie
              - entity: switch.sonoff_4chpror3_ogrzewanie_piec_mieszacz_grzejniki_zamykanie
                name: Mieszacz grzejniki – zamykanie
              - entity: automation.wlacz_cyrkulacje
                name: Cyrkulacja – harmonogram
      - type: grid
        cards:
          - type: heading
            heading: Siłowniki
            icon: mdi:valve
          - type: entities
            state_color: true
            entities:
{% for i in home_assistant_config.climate %}
              - entity: {{ i.switch }}
                name: {{ i.label | default(room_labels[i.name] | default(i.name)) }}
{% endfor %}

  # =====================================================================
  # Kamery: snapshots (cheap on mobile data), tap = live
  # =====================================================================
  - title: Kamery
    path: kamery
    icon: mdi:cctv
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
{% for cam in [['reolink_doorbell', 'Furtka'], ['reolink_e1pro_drzwi', 'Drzwi'], ['reolink_e1pro_garaz', 'Garaż'], ['reolink_e1pro_kuchnia', 'Kuchnia'], ['yi_salon', 'Salon'], ['yi_sypialnia', 'Sypialnia']] %}
          - type: picture-entity
            entity: camera.{{ cam[0] }}
            name: {{ cam[1] }}
            camera_view: auto
            show_state: false
            grid_options:
              columns: 6
{% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Dzwonek
            icon: mdi:doorbell-video
          - type: tile
            entity: select.reolink_furtka_play_quick_reply_message
            name: Odtwórz wiadomość
            features:
              - type: select-options
          - type: tile
            entity: siren.reolink_furtka_siren
            name: Syrena
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.reolink_furtka_person
            name: Osoba
            grid_options:
              columns: 6

  # =====================================================================
  # Ogród
  # =====================================================================
  - title: Ogród
    path: ogrod
    icon: mdi:tree
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.open_meteo
            forecast_type: hourly
          - type: tile
            entity: sensor.th_ogrod_temperature
            name: Czujnik ogród
            grid_options:
              columns: 6
            visibility: {{ hide_unavailable | replace('ENTITY', 'sensor.th_ogrod_temperature') }}
          - type: tile
            entity: sensor.th_ogrod_humidity
            name: Wilgotność
            grid_options:
              columns: 6
            visibility: {{ hide_unavailable | replace('ENTITY', 'sensor.th_ogrod_humidity') }}
          - type: picture
            image: https://www.meteo.pl/um/metco/mgram_pict.php?ntype=0u&row=342&col=208&lang=pl
      - type: grid
        cards:
          - type: heading
            heading: Kosiarka
            icon: mdi:robot-mower
          - type: tile
            entity: lawn_mower.sileno_life_750_lawn_mower
            name: Sileno
            features:
              - type: lawn-mower-commands
                commands:
                  - start_pause
                  - dock
          - type: tile
            entity: sensor.sileno_life_750_battery_level
            name: Bateria
            grid_options:
              columns: 6
      # Rain Bird and the 4CH garden lights are not loaded in HA right now – add back when they return.

  # =====================================================================
  # Więcej: rarely used devices + housekeeping
  # =====================================================================
  - title: Więcej
    path: wiecej
    icon: mdi:dots-horizontal
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Sprzątanie
            icon: mdi:robot-vacuum
          - type: tile
            entity: vacuum.roborock_qrevo_master
            name: Roborock
            state_content:
              - state
              - battery_level
            features:
              - type: vacuum-commands
