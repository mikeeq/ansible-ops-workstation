---
# Periodic/startup triggers reconcile CH enable with the UFH pump after restarts
- alias: piec_off
  description: ""
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - >-
          switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      to: "off"
      for:
        hours: 0
        minutes: 0
        seconds: 15
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      state: "off"
      for:
        seconds: 15
    - condition: state
      entity_id: switch.opentherm_ch_enable
      state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.opentherm_ch_enable
- alias: piec_on
  description: ""
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - >-
          switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      to: "on"
      # Wait for mixer to fully open up, ARA661 (120s + delay from driver)
      for:
        hours: 0
        minutes: 5
        seconds: 0
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      state: "on"
      for:
        minutes: 5
    - condition: state
      entity_id: switch.opentherm_ch_enable
      state: "off"
  actions:
    # Setpoint comes from number.opentherm_ch_target; anti-cycling runs on the ESPHome device
    - action: switch.turn_on
      target:
        entity_id: switch.opentherm_ch_enable

# Cycling alert; the trailing delay with mode single limits it to one notification per 4 h
- id: piec_taktowanie_alert
  alias: piec_taktowanie_alert
  description: "Powiadomienie, gdy kocioł startuje więcej niż 4 razy/h przez 30 min"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: numeric_state
      entity_id: sensor.piec_starty_1h
      above: 4
      for:
        minutes: 30
  actions:
    - action: notify.mobile_app_pixel_9_pro
      data:
        title: "Piec - taktowanie"
{% raw %}
        message: >-
          {{ states('sensor.piec_starty_1h') }} startów/h, średnio {{ states('sensor.piec_sredni_czas_pracy') }} min
          palenia. Sprawdź rotametry, otwarte strefy i ch_target.
{% endraw %}
        data:
          tag: piec_taktowanie
          channel: Temperature
    - delay: "04:00:00"
