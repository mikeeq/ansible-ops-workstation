---
# Periodic/startup triggers reconcile CH enable with the UFH pump after restarts
- alias: piec_off
  description: ""
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - >-
          switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      to: "off"
      for:
        hours: 0
        minutes: 0
        seconds: 15
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      state: "off"
      for:
        seconds: 15
    - condition: state
      entity_id: switch.opentherm_ch_enable
      state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.opentherm_ch_enable
- alias: piec_on
  description: ""
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - >-
          switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      to: "on"
      # Wait for mixer to fully open up, ARA661 (120s + delay from driver)
      for:
        hours: 0
        minutes: 5
        seconds: 0
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      state: "on"
      for:
        minutes: 5
    - condition: state
      entity_id: switch.opentherm_ch_enable
      state: "off"
  actions:
    # Setpoint comes from number.opentherm_ch_target; anti-cycling runs on the ESPHome device
    - action: switch.turn_on
      target:
        entity_id: switch.opentherm_ch_enable
