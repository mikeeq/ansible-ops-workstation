---
{% raw %}
# Burner counters computed in HA, the boiler's own OpenTherm counter is stuck at 65535;
# binary_sensor.piec_palnik ignores OpenTherm/HA outages (unavailable -> on is not a start)
- platform: history_stats
  name: piec_starty_1h
  unique_id: piec_starty_1h
  entity_id: binary_sensor.piec_palnik
  state: "on"
  type: count
  start: "{{ now() - timedelta(hours=1) }}"
  end: "{{ now() }}"

- platform: history_stats
  name: piec_starty_24h
  unique_id: piec_starty_24h
  entity_id: binary_sensor.piec_palnik
  state: "on"
  type: count
  start: "{{ now() - timedelta(hours=24) }}"
  end: "{{ now() }}"

- platform: history_stats
  name: piec_praca_1h
  unique_id: piec_praca_1h
  entity_id: binary_sensor.piec_palnik
  state: "on"
  type: ratio
  start: "{{ now() - timedelta(hours=1) }}"
  end: "{{ now() }}"
{% endraw %}

# Estimated gas energy (kWh) from the template power sensors gaz_moc_co / gaz_moc_cwu (kW)
- platform: integration
  name: gaz_energia_co
  unique_id: gaz_energia_co
  source: sensor.gaz_moc_co
  method: left
  round: 3
  unit_time: h
  max_sub_interval:
    minutes: 5

- platform: integration
  name: gaz_energia_cwu
  unique_id: gaz_energia_cwu
  source: sensor.gaz_moc_cwu
  method: left
  round: 3
  unit_time: h
  max_sub_interval:
    minutes: 5
