---
# UFH pump follows the zone actuators; the board on the boiler handles anti-cycling.
# Periodic/startup triggers reconcile the pump after HA or Sonoff restarts.
- id: ogrzewanie_pompa
  alias: ogrzewanie_pompa
  description: "Pompa podłogówki ON, gdy dowolny siłownik jest otwarty od 4 min; OFF, gdy wszystkie zamknięte od 1 min"
  mode: queued
  max: 3
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: switch.group_ogrzewanie_podlogowe
      to: "on"
      for:
        minutes: 4
    - trigger: state
      entity_id: switch.group_ogrzewanie_podlogowe
      to: "off"
      for:
        minutes: 1
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: "/5"
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.group_ogrzewanie_podlogowe
              state: "on"
              for:
                minutes: 4
            - condition: state
              entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
              state: "off"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
        - conditions:
            - condition: state
              entity_id: switch.group_ogrzewanie_podlogowe
              state: "off"
              for:
                minutes: 1
            - condition: state
              entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
              state: "on"
            # Service mode with loops opened by hand keeps the pump on (ogrzewanie_serwis)
            - condition: not
              conditions:
                - condition: state
                  entity_id: input_select.ogrzewanie_serwis
                  state: Pompa i kocioł – pętle ręcznie
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka

# Heating curve: boiler setpoint from the outdoor temperature (Airly, IMGW fallback; 36 - 0.3 * T_out, 34-42 °C).
# The OpenTherm board keeps the last value when HA is down; written only when it changes (flash wear).
# "Stałe ciepło" flag: 42 °C, so pauses end at 34 °C (42 - start_below) and Euroster caps the peaks at 38 °C;
# works with or without the service mode, the curve value comes back as soon as the flag goes off.
- id: ogrzewanie_krzywa_grzewcza
  alias: ogrzewanie_krzywa_grzewcza
  description: "Nastawa kotła ch_target = 36 − 0,3 × temperatura zewnętrzna (Airly → IMGW), ograniczona do 34–42 °C; przy „stałym cieple” 42 °C"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: sensor.temperatura_zewnetrzna
    - trigger: state
      entity_id: input_boolean.ogrzewanie_serwis_cieplo
    - trigger: time_pattern
      minutes: "/30"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >-
        {% raw %}{{ is_number(states('sensor.temperatura_zewnetrzna'))
        or is_state('input_boolean.ogrzewanie_serwis_cieplo', 'on') }}{% endraw %}
{% raw %}
  variables:
    target: >-
      {{ 42 if is_state('input_boolean.ogrzewanie_serwis_cieplo', 'on') else
      [[(36 - 0.3 * states('sensor.temperatura_zewnetrzna') | float(0)) | round(0), 34] | max, 42] | min | int }}
  actions:
    - if:
        - condition: template
          value_template: "{{ states('number.opentherm_ch_target') | float(0) | int != target }}"
      then:
        - action: number.set_value
          target:
            entity_id: number.opentherm_ch_target
          data:
            value: "{{ target }}"
{% endraw %}

# "Stałe ciepło" must not stay on by accident: timer.ogrzewanie_cieplo (2 h, survives restarts) switches it off
- id: ogrzewanie_cieplo_limit
  alias: ogrzewanie_cieplo_limit
  description: "Stałe ciepło (ch_target 42 °C) wyłącza się samo po 2 h"
  mode: queued
  max: 3
  triggers:
    - trigger: state
      entity_id: input_boolean.ogrzewanie_serwis_cieplo
      to: "on"
      id: start
    # Flag left on without a running timer (e.g. restored after a restart): start the 2 h now
    - trigger: homeassistant
      event: start
      id: start
    - trigger: state
      entity_id: input_boolean.ogrzewanie_serwis_cieplo
      to: "off"
      id: stop
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.ogrzewanie_cieplo
      id: koniec
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: start
            - condition: state
              entity_id: input_boolean.ogrzewanie_serwis_cieplo
              state: "on"
            - condition: state
              entity_id: timer.ogrzewanie_cieplo
              state: idle
          sequence:
            - action: timer.start
              target:
                entity_id: timer.ogrzewanie_cieplo
        - conditions:
            - condition: trigger
              id: stop
            - condition: state
              entity_id: timer.ogrzewanie_cieplo
              state:
                - active
                - paused
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.ogrzewanie_cieplo
        - conditions:
            - condition: trigger
              id: koniec
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.ogrzewanie_serwis_cieplo

# Heating season from the 24 h outdoor mean: > 16 °C thermostats off, < 14 °C heat (hysteresis 2 K).
# initial_hvac_mode: heat resets the thermostats on every HA start, hence the start trigger.
- id: ogrzewanie_sezon
  alias: ogrzewanie_sezon
  description: "Sezon grzewczy: średnia 24 h > 16 °C → termostaty off, < 14 °C → heat"
  mode: single
  triggers:
    - trigger: time
      at: "06:00:00"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id:
            - timer.ogrzewanie_wietrzenie
            - timer.ogrzewanie_serwis
          match: any
          state:
            - active
            - paused
    - condition: not
      conditions:
        - condition: state
          entity_id: input_boolean.ogrzewanie_wylaczone
          state: "on"
  actions:
    - delay:
        minutes: 2
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.temperatura_zewnetrzna_srednia_24h
              above: 16
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id:
{% for i in home_assistant_config.climate %}
                  - climate.{{ i.name }}
{% endfor %}
              data:
                hvac_mode: "off"
        - conditions:
            - condition: numeric_state
              entity_id: sensor.temperatura_zewnetrzna_srednia_24h
              below: 14
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id:
{% for i in home_assistant_config.climate %}
                  - climate.{{ i.name }}
{% endfor %}
              data:
                hvac_mode: heat

# West-facing rooms (roof windows: Julia, Timi; terrace door/windows: salon, ground-floor bedroom) overheat on sunny
# afternoons and the screed lags 2-4 h. The salon used to heat 01:00-07:30 before a sunny day and then overshot by
# 1.5-1.7 K, so the decision is taken at 01:00: on a sunny forecast lower the setpoints, restore at sunset
# (or at HA start after sunset).
- id: ogrzewanie_slonce
  alias: ogrzewanie_slonce
  description: "Prognoza >= 3 h słońca 11-17 → pokoje zachodnie (Julia, Timi, salon, sypialnia dół) −1 K od 01:00 do zachodu słońca"
  mode: queued
  max: 3
  triggers:
    - trigger: time
      at: "01:00:00"
      id: start
    - trigger: sun
      event: sunset
      id: koniec
    - trigger: homeassistant
      event: start
      id: ha_start
  variables:
    pokoje:
      - climate.pokoj_julia
      - climate.pokoj_timi
      - climate.salon
      - climate.sypialnia_dol
    obnizenie: 1.0
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: start
            - condition: state
              entity_id: input_boolean.ogrzewanie_slonce
              state: "off"
            - condition: state
              entity_id: climate.pokoj_julia
              state: heat
            - condition: not
              conditions:
                - condition: state
                  entity_id: weather.open_meteo
                  state:
                    - unavailable
                    - unknown
          sequence:
            - action: weather.get_forecasts
              target:
                entity_id: weather.open_meteo
              data:
                type: hourly
              response_variable: prognoza
{% raw %}
            - variables:
                godziny_slonca: >-
                  {%- set ns = namespace(h=0) %}
                  {%- for f in prognoza['weather.open_meteo'].forecast | default([]) %}
                  {%- set t = as_datetime(f.datetime) %}
                  {%- if today_at('11:00') <= t < today_at('17:00') and f.cloud_coverage | float(100) <= 40 %}
                  {%- set ns.h = ns.h + 1 %}
                  {%- endif %}
                  {%- endfor %}
                  {{ ns.h }}
            - condition: template
              value_template: "{{ godziny_slonca | int >= 3 }}"
            - repeat:
                for_each: "{{ pokoje }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      temperature: "{{ (state_attr(repeat.item, 'temperature') | float - obnizenie) | round(1) }}"
{% endraw %}
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.ogrzewanie_slonce
        - conditions:
            - condition: trigger
              id:
                - koniec
                - ha_start
            - condition: state
              entity_id: input_boolean.ogrzewanie_slonce
              state: "on"
            - condition: or
              conditions:
                - condition: trigger
                  id: koniec
                - condition: state
                  entity_id: sun.sun
                  state: below_horizon
          sequence:
{% raw %}
            - repeat:
                for_each: "{{ pokoje }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      temperature: "{{ (state_attr(repeat.item, 'temperature') | float + obnizenie) | round(1) }}"
{% endraw %}
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.ogrzewanie_slonce

- id: ogrzewanie_czujniki_niedostepne
  alias: ogrzewanie_czujniki_niedostepne
  description: "Powiadomienie, gdy czujnik termostatu strefy jest niedostępny (termostat wtedy nie grzeje)"
  mode: single
  triggers:
    - trigger: state
      entity_id:
{% for i in home_assistant_config.climate %}
        - "sensor.{{ i.sensor_type | default('th') }}_{{ i.name }}_temperature"
{% endfor %}
      to:
        - unavailable
        - unknown
      for:
        hours: 2
    - trigger: time
      at: "09:00:00"
  variables:
    sensors:
{% for i in home_assistant_config.climate %}
      - "sensor.{{ i.sensor_type | default('th') }}_{{ i.name }}_temperature"
{% endfor %}
{% raw %}
    missing: >-
      {{ sensors | select('is_state', ['unavailable', 'unknown']) | list }}
  conditions:
    - condition: template
      value_template: "{{ missing | count > 0 }}"
  actions:
    - action: notify.mobile_app_pixel_9_pro
      data:
        title: "Ogrzewanie - czujniki"
        message: >-
          Strefy bez temperatury (nie grzeją): {{ missing | map('replace', 'sensor.', '') | map('replace', '_temperature', '') | join(', ') }}
        data:
          tag: ogrzewanie_czujniki
          channel: Temperature
{% endraw %}

# Washer/dryer heat the bathroom air, so the thermostat stops calling and the floor goes cold.
# The thermostat is set to off for the run because keep_alive would close a manually opened actuator.
# Restart-safe: initial_hvac_mode: heat brings the thermostat back.
{% for i in home_assistant_config.climate if i.name in ['lazienka_dol', 'lazienka_gora'] %}
- id: ogrzewanie_podloga_{{ i.name }}
  alias: ogrzewanie_podloga_{{ i.name }}
  description: "Podłoga {{ i.name }}: 45 min grzania, gdy pętla nie grzała od 8 h (od 4 h, gdy i tak grzeją inne strefy), 05–22"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: {{ i.switch }}
      to: "off"
      for:
        hours: 8
    - trigger: time
      at: "05:00:00"
    - trigger: state
      entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
      to: "on"
      for:
        minutes: 10
  conditions:
    - condition: state
      entity_id: climate.{{ i.name }}
      state: heat
    - condition: time
      after: "05:00:00"
      before: "22:00:00"
    - condition: numeric_state
      entity_id: climate.{{ i.name }}
      attribute: current_temperature
      below: 25
    - condition: or
      conditions:
        - condition: state
          entity_id: {{ i.switch }}
          state: "off"
          for:
            hours: 8
        - condition: and
          conditions:
            - condition: state
              entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
              state: "on"
            - condition: state
              entity_id: {{ i.switch }}
              state: "off"
              for:
                hours: 4
  actions:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.{{ i.name }}
      data:
        hvac_mode: "off"
    - action: switch.turn_on
      target:
        entity_id: {{ i.switch }}
    - delay:
        minutes: 45
    # Airing or service mode took over the zones meanwhile: leave the actuators and thermostats to them
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id:
                - timer.ogrzewanie_wietrzenie
                - timer.ogrzewanie_serwis
              match: any
              state:
                - active
                - paused
      then:
        - action: switch.turn_off
          target:
            entity_id: {{ i.switch }}
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.{{ i.name }}
          data:
            hvac_mode: heat
{% endfor %}

# Airing (dashboard button = timer.ogrzewanie_wietrzenie): every zone off while the timer runs, so the actuators close
# and the UFH pump and boiler CH follow; DHW keeps working. Back to heat when the timer ends or is cancelled, unless
# the 24 h mean says summer. initial_hvac_mode: heat turns the zones on at HA start, so off is re-applied then.
- id: ogrzewanie_wietrzenie
  alias: ogrzewanie_wietrzenie
  description: "Wietrzenie: wszystkie strefy off na czas timera (przycisk na dashboardzie), potem heat"
  mode: queued
  max: 3
  triggers:
    - trigger: state
      entity_id: timer.ogrzewanie_wietrzenie
      to: active
      id: start
    - trigger: homeassistant
      event: start
      id: start
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.ogrzewanie_wietrzenie
      id: koniec
    - trigger: event
      event_type: timer.cancelled
      event_data:
        entity_id: timer.ogrzewanie_wietrzenie
      id: koniec
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: start
            - condition: state
              entity_id: timer.ogrzewanie_wietrzenie
              state: active
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id:
{% for i in home_assistant_config.climate %}
                  - climate.{{ i.name }}
{% endfor %}
              data:
                hvac_mode: "off"
        - conditions:
            - condition: trigger
              id: koniec
            - condition: not
              conditions:
                - condition: state
                  entity_id: timer.ogrzewanie_serwis
                  state:
                    - active
                    - paused
            - condition: not
              conditions:
                - condition: state
                  entity_id: input_boolean.ogrzewanie_wylaczone
                  state: "on"
            # unavailable mean -> still restore, heating must never stay off by accident
            - condition: not
              conditions:
                - condition: numeric_state
                  entity_id: sensor.temperatura_zewnetrzna_srednia_24h
                  above: 16
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id:
{% for i in home_assistant_config.climate %}
                  - climate.{{ i.name }}
{% endfor %}
              data:
                hvac_mode: heat

# Service mode for the thermal camera / rotameters (input_select.ogrzewanie_serwis on the Kotłownia view): every zone
# off so the thermostats don't fight, then only the chosen actuator channel (or all of them) open; the UFH pump and
# boiler CH follow. timer.ogrzewanie_serwis (60 min, survives restarts) ends it, then the zones go back to heat.
- id: ogrzewanie_serwis
  alias: ogrzewanie_serwis
  description: "Serwis ogrzewania: otwarta wybrana pętla albo wszystkie, albo pompa + kocioł przy pętlach otwieranych ręcznie (kamera, rotametry), maks. 60 min"
  mode: queued
  max: 5
  triggers:
    - trigger: state
      entity_id: input_select.ogrzewanie_serwis
      not_from:
        - unavailable
        - unknown
      id: wybor
    - trigger: homeassistant
      event: start
      id: ha_start
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.ogrzewanie_serwis
      id: koniec
    - trigger: event
      event_type: timer.cancelled
      event_data:
        entity_id: timer.ogrzewanie_serwis
      id: koniec
  variables:
    kanaly:
      "Parter 1 – łazienka (dol1)": switch.sonoff_4chpror3_ogrzewanie_dol1_lazienka
      "Parter 2–3 – sypialnia (dol1)": switch.sonoff_4chpror3_ogrzewanie_dol1_sypialnia
      "Parter 4–6 – salon (dol1)": switch.sonoff_4chpror3_ogrzewanie_dol1_salon
      "Parter 7 – kuchnia (dol1)": switch.sonoff_4chpror3_ogrzewanie_dol1_kuchnia
      "Parter 8 – korytarz (dol2)": switch.sonoff_4chpror3_ogrzewanie_dol2_korytarz
      "Piętro 1–3 – pokój Julia (gora1)": switch.sonoff_4chpror3_ogrzewanie_gora1_pokoj_julia
      "Piętro 4 – garderoba (gora1)": switch.sonoff_4chpror3_ogrzewanie_gora1_garderoba
      "Piętro 5–6 – sypialnia (gora1)": switch.sonoff_4chpror3_ogrzewanie_gora1_sypialnia
      "Piętro 7–9 – biuro Miki (gora1)": switch.sonoff_4chpror3_ogrzewanie_gora1_pokoj_nad_garazem
      "Piętro 10 – łazienka (gora2)": switch.sonoff_4chpror3_ogrzewanie_gora2_lazienka
      "Piętro 11 – pokój Timi (gora2)": switch.sonoff_4chpror3_ogrzewanie_gora2_pokoj_timi
      "Piętro 12 – korytarz (gora2)": switch.sonoff_4chpror3_ogrzewanie_gora2_korytarz
{% raw %}
    wybor: "{{ states('input_select.ogrzewanie_serwis') }}"
    otwarte: >-
      {{ kanaly.values() | list if wybor == 'Wszystkie pętle' else [kanaly[wybor]] if wybor in kanaly else [] }}
    zamkniete: "{{ kanaly.values() | reject('in', otwarte) | list }}"
    reczne: "{{ wybor == 'Pompa i kocioł – pętle ręcznie' }}"
    serwis_trwa: "{{ is_state('timer.ogrzewanie_serwis', ['active', 'paused']) }}"
{% endraw %}
  actions:
    - choose:
        # Loop(s) chosen (or HA restarted during the service): zones off, open only the chosen channels;
        # "pętle ręcznie": all channels closed, pump forced on (piec_on enables boiler CH 5 min later)
        - conditions:
{% raw %}
            - "{{ otwarte | count > 0 or reczne }}"
            - "{{ trigger.id == 'wybor' or serwis_trwa }}"
{% endraw %}
          sequence:
            # Each new choice gets a fresh 60 min
            - if:
                - condition: trigger
                  id: wybor
              then:
                - action: timer.start
                  target:
                    entity_id: timer.ogrzewanie_serwis
            - action: climate.set_hvac_mode
              target:
                entity_id:
{% for i in home_assistant_config.climate %}
                  - climate.{{ i.name }}
{% endfor %}
              data:
                hvac_mode: "off"
{% raw %}
            - if:
                - "{{ zamkniete | count > 0 }}"
              then:
                - action: switch.turn_off
                  target:
                    entity_id: "{{ zamkniete }}"
            - if:
                - "{{ otwarte | count > 0 }}"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: "{{ otwarte }}"
            - if:
                - "{{ reczne }}"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.sonoff_4chpror3_ogrzewanie_piec_pompa_podlogowka
{% endraw %}
        # End: timer done/cancelled, "Wyłączony" chosen, or a leftover selection after a restart
        - conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: koniec
                - "{% raw %}{{ trigger.id == 'wybor' and otwarte | count == 0 and not reczne }}{% endraw %}"
                - "{% raw %}{{ trigger.id == 'ha_start' and wybor != 'Wyłączony' }}{% endraw %}"
          sequence:
{% raw %}
            - action: switch.turn_off
              target:
                entity_id: "{{ kanaly.values() | list }}"
{% endraw %}
            - if:
                - condition: state
                  entity_id: timer.ogrzewanie_serwis
                  state:
                    - active
                    - paused
              then:
                - action: timer.cancel
                  target:
                    entity_id: timer.ogrzewanie_serwis
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.ogrzewanie_serwis_bez_kotla
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: input_select.ogrzewanie_serwis
                      state: Wyłączony
              then:
                - action: input_select.select_option
                  target:
                    entity_id: input_select.ogrzewanie_serwis
                  data:
                    option: Wyłączony
            - if:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: timer.ogrzewanie_wietrzenie
                      state:
                        - active
                        - paused
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: input_boolean.ogrzewanie_wylaczone
                      state: "on"
                - condition: not
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.temperatura_zewnetrzna_srednia_24h
                      above: 16
              then:
                - action: climate.set_hvac_mode
                  target:
                    entity_id:
{% for i in home_assistant_config.climate %}
                      - climate.{{ i.name }}
{% endfor %}
                  data:
                    hvac_mode: heat

# Heating off until switched back (input_boolean.ogrzewanie_wylaczone, dashboard): every zone off, so HA opens no
# actuator; airing, service mode and the season automation don't turn heat back on while it is on.
- id: ogrzewanie_wylaczone
  alias: ogrzewanie_wylaczone
  description: "Ogrzewanie wyłączone na stałe (przełącznik na dashboardzie): strefy off, po wyłączeniu przełącznika heat"
  mode: queued
  max: 3
  triggers:
    - trigger: state
      entity_id: input_boolean.ogrzewanie_wylaczone
      from: "off"
      to: "on"
