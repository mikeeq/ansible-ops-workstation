---
- job:
    name: Backup Clevo
    project-type: pipeline
    sandbox: true
    description: "Nightly restic backup of mikeeClevo (playbooks/backup.yaml, role mikeeq.apps_server.backup_restic)"
    triggers:
      - timed: '30 3 * * *'
    parameters:
      - string:
          name: "BRANCH_ANSIBLE_OPS_WORKSTATION"
          default: "main"
          trim: true
          description: "Branch name repo: ansible-ops-workstation"
      - string:
          name: "BRANCH_ANSIBLE_OPS_PRIVATE"
          default: "main"
          trim: true
          description: "Branch name repo: ansible-ops-private"
      - bool:
          name: "BACKUP_RUN"
          default: true
          description: "Run the backup (false = only install/configure restic and the backup script)"
    dsl-yaml: |
      pipeline:
        agent:
          any:
        options:
          - ansiColor('xterm')
          - disableConcurrentBuilds()
          - skipDefaultCheckout()
          - timeout(time: 7, unit: 'HOURS')
          - buildDiscarder(logRotator(numToKeepStr: '30'))
        stages:
          - stage: "Checkout ansible-ops-workstation"
            steps:
              script:
                - dir: "'ansible-ops-workstation'"
                  script:
                    - >-
                      git(
                        url: "git@github.com:mikeeq/ansible-ops-workstation.git",
                        branch: "$params.BRANCH_ANSIBLE_OPS_WORKSTATION"
                      )
          - stage: "Checkout ansible-ops-private"
            steps:
              script:
                - dir: "'ansible-ops-private'"
                  script:
                    - >-
                      git(
                        url: "git@github.com:mikeeq/ansible-ops-private.git",
                        branch: "$params.BRANCH_ANSIBLE_OPS_PRIVATE"
                      )
          - stage: "Unlock git-crypt"
            steps:
              script:
                - dir: "'ansible-ops-private'"
                  script:
                    - |
                      sh """#!/bin/bash
                        git-crypt unlock ~jenkins/secrets/git_crypt_key
                      """
          - stage: "Mise Install"
            steps:
              script:
                  - |
                    sh """#!/bin/bash
                      cd ansible-ops-workstation
                      mise install --yes
                    """
          - stage: "Backup"
            steps:
              script:
                  - |
                    sh """#!/bin/bash
                      cd ansible-ops-workstation/playbooks
                      mise exec -- ansible-playbook -i ../../ansible-ops-private/inventory/hosts.yaml -e backup_restic_run=$params.BACKUP_RUN backup.yaml
                    """
