---
- name: JENKINS-CREDENTIALS | Create CRUMB authentication request
  ansible.builtin.uri:
    url: '{{ jenkins_url }}/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,":",//jenkins_crumb)'
    user: "{{ jenkins_crumb_admin_username }}"
    password: "{{ jenkins_crumb_admin_password }}"
    force_basic_auth: true
    return_content: true
  register: jenkins_crumb
  no_log: false
  retries: 10
  delay: 10
  until: jenkins_crumb.status == 200
