---
- name: Ensure install dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ coredns_install_path }}"
    - "{{ coredns_install_path }}/config"

- name: Configure docker-compose file
  become: true
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ coredns_install_path }}/{{ item }}"
    mode: "0664"
  loop:
    - docker-compose.yaml
    - config/Corefile

- name: Import config.yaml
  ansible.builtin.import_tasks: config.yaml

- name: Ensure LAN macvlan docker network exists
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    docker network inspect {{ coredns_macvlan_network_name }} >/dev/null 2>&1 && exit 0
    docker network create -d macvlan \
      --subnet={{ coredns_macvlan_subnet }} \
      --gateway={{ coredns_macvlan_gateway }} \
      -o parent={{ coredns_macvlan_parent }} \
      {{ coredns_macvlan_network_name }}
  args:
    executable: /bin/bash
  register: coredns_macvlan_net
  changed_when: coredns_macvlan_net.stdout | length == 64

- name: Pull Docker image using docker-compose
  become: true
  ansible.builtin.command: docker-compose pull
  changed_when: coredns_pull_result.stderr_lines | length > 2
  register: coredns_pull_result
  args:
    chdir: "{{ coredns_install_path }}"

- name: Run using docker-compose
  become: true
  ansible.builtin.command: docker-compose up -d
  changed_when: coredns_up_result.stderr_lines | length > 2
  register: coredns_up_result
  args:
    chdir: "{{ coredns_install_path }}"
