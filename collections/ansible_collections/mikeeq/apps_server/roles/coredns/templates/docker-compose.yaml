# https://docs.docker.com/compose/compose-file/compose-file-v3/
---
version: '3.8'
services:
  coredns:
    image: coredns/coredns
    container_name: coredns
    restart: always # other option: always - if you want persistent through host reboots
    # Own IP on the LAN via macvlan, so no host port mapping/NAT is needed.
    networks:
      {{ coredns_macvlan_network_name }}:
        ipv4_address: {{ coredns_macvlan_ip }}
    expose:
      - '53'
      - '53/udp'
      - '9153'
    volumes:
      - './config:/etc/coredns'
    command: ["-conf", "/etc/coredns/Corefile"]
    logging:
      driver: "json-file"
      options:
        max-size: "250m"

networks:
  {{ coredns_macvlan_network_name }}:
    external: true
