---
- name: Grab cert from dns1 - slurp
  ansible.builtin.slurp:
    src: "{{ letsencrypt_coredns_certs_path }}/{{ item.0 }}/{{ item.1 }}"
  with_nested:
    - "{{ letsencrypt_coredns_certs | map(attribute='cn') }}"
    - ["cert.key", "cert.crt", "cert.fullchain"]
  register: letsencrypt_coredns_slurp_res

- name: Make sure that path for letsencrypt_coredns_certs exists on localhost
  ansible.builtin.file:
    path: "{{ letsencrypt_coredns_certs_path }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ letsencrypt_coredns_certs | map(attribute='cn') }}"
  delegate_to: 127.0.0.1

- name: Copy letsencrypt_coredns_certs to localhost
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ item.source }}"
    owner: root
    group: root
    mode: "0644"
  delegate_to: 127.0.0.1
  loop: "{{ letsencrypt_coredns_slurp_res.results }}"
  loop_control:
    label: "{{ item.item[0] }} - {{ item.item[1] }}"
