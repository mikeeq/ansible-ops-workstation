---
- name: Ensure install dir exists
  ansible.builtin.file:
    path: "{{ opencloud_install_path }}"
    state: directory
    mode: "0755"

- name: Ensure dirs owned by the OpenCloud container user exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ opencloud_uid }}"
    group: "{{ opencloud_gid }}"
    mode: "0750"
  loop: "{{ [opencloud_data_path, opencloud_config_path] + ([opencloud_radicale_data_path] if opencloud_radicale_enabled | bool else []) }}"

- name: Configure docker-compose file
  ansible.builtin.template:
    src: docker-compose.yaml
    dest: "{{ opencloud_install_path }}/docker-compose.yaml"
    mode: "0600"
    backup: true

- name: Configure OpenCloud config files
  ansible.builtin.template:
    src: "config/{{ item }}"
    dest: "{{ opencloud_config_path }}/{{ item }}"
    owner: "{{ opencloud_uid }}"
    group: "{{ opencloud_gid }}"
    mode: "0644"
  loop: "{{ opencloud_config_files }}"
  register: opencloud_config_result

- name: Ensure unused OpenCloud config files are absent
  ansible.builtin.file:
    path: "{{ opencloud_config_path }}/{{ item }}"
    state: absent
  loop: "{{ opencloud_optional_config_files | difference(opencloud_config_files) }}"
  register: opencloud_config_absent_result

- name: Configure radicale
  ansible.builtin.template:
    src: config/radicale.config
    dest: "{{ opencloud_install_path }}/radicale.config"
    mode: "0644"
  when: opencloud_radicale_enabled | bool
  register: opencloud_radicale_config_result

# WOPI proof key, coolwsd runs as uid 1001 and expects a PKCS#1 RSA key
- name: Generate Collabora WOPI proof key
  community.crypto.openssl_privatekey:
    path: "{{ opencloud_install_path }}/collabora_proof_key"
    type: RSA
    size: 4096
    format: pkcs1
    owner: "1001"
    group: "1001"
    mode: "0400"
  when: opencloud_office == "collabora"
  register: opencloud_proof_key_result

- name: Import webapps.yaml
  ansible.builtin.import_tasks: webapps.yaml

- name: Pull Docker image using docker-compose
  ansible.builtin.command: docker-compose pull
  changed_when: opencloud_pull_result.stderr_lines | length > 2
  register: opencloud_pull_result
  args:
    chdir: "{{ opencloud_install_path }}"

- name: Run using docker-compose
  ansible.builtin.command: docker-compose up -d --remove-orphans
  changed_when: opencloud_up_result.stderr_lines | length > 2
  register: opencloud_up_result
  args:
    chdir: "{{ opencloud_install_path }}"

# config files and web apps are only read on startup
- name: Restart containers with changed config
  ansible.builtin.command: "docker-compose restart {{ item.service }}"
  changed_when: true
  args:
    chdir: "{{ opencloud_install_path }}"
  loop:
    - service: opencloud
      changed: "{{ opencloud_config_result.changed or opencloud_config_absent_result.changed or opencloud_web_apps_changed }}"
    - service: radicale
      changed: "{{ opencloud_radicale_config_result.changed }}"
    - service: collabora
      changed: "{{ opencloud_proof_key_result.changed }}"
  loop_control:
    label: "{{ item.service }}"
  when: item.changed | bool
