# Based on https://github.com/opencloud-eu/opencloud-compose (stable-7.2):
# docker-compose.yml + weboffice/collabora.yml + radicale/radicale.yml
# + external-proxy/*.yml, TLS is terminated by the nginx role.
{% set opencloud_extra_hosts = [opencloud_domain] + ([opencloud_collabora_domain] if opencloud_collabora_enabled else []) %}
---
name: opencloud

services:
  opencloud:
    container_name: opencloud
    image: "{{ opencloud_image }}:{{ opencloud_version }}"
    user: "{{ opencloud_uid }}:{{ opencloud_gid }}"
    networks:
      - opencloud-net
    entrypoint:
      - /bin/sh
    # "opencloud init" creates config/opencloud.yaml with random secrets on the
    # first start and fails on subsequent starts, hence "|| true"
    command: ["-c", "opencloud init || true; opencloud server"]
    environment:
      OC_URL: "https://{{ opencloud_domain }}"
      OC_LOG_LEVEL: "info"
      OC_LOG_COLOR: "false"
      OC_LOG_PRETTY: "false"
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      PROXY_TLS: "false"
      OC_INSECURE: "{{ opencloud_insecure | string | lower }}"
      PROXY_ENABLE_BASIC_AUTH: "false"
      IDM_CREATE_DEMO_USERS: "false"
      IDM_ADMIN_PASSWORD: "{{ opencloud_admin_password }}"
      FRONTEND_ARCHIVER_MAX_SIZE: "10000000000"
      FRONTEND_CHECK_FOR_UPDATES: "true"
      PROXY_CSP_CONFIG_FILE_LOCATION: "/etc/opencloud/csp.yaml"
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "true"
      OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: "false"
      OC_DEFAULT_LANGUAGE: "{{ opencloud_default_language }}"
{% if opencloud_collabora_enabled %}
      # WOPI (collaboration) service runs inside the opencloud process and is
      # served under /wopi and /collaboration on the opencloud domain
      OC_ADD_RUN_SERVICES: "collaboration"
      FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR: "eu.opencloud.api.collaboration"
      GRAPH_AVAILABLE_ROLES: "b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6"
      COLLABORATION_WOPI_SRC: "https://{{ opencloud_domain }}"
      COLLABORATION_APP_NAME: "CollaboraOnline"
      COLLABORATION_APP_PRODUCT: "Collabora"
      COLLABORATION_APP_ADDR: "https://{{ opencloud_collabora_domain }}"
      COLLABORATION_APP_ICON: "https://{{ opencloud_collabora_domain }}/favicon.ico"
      COLLABORATION_APP_INSECURE: "{{ opencloud_insecure | string | lower }}"
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "{{ opencloud_insecure | string | lower }}"
{% endif %}
    volumes:
      # holds opencloud.yaml (generated secrets), csp.yaml and proxy.yaml
      - "{{ opencloud_config_path }}:/etc/opencloud"
      - "{{ opencloud_data_path }}:/var/lib/opencloud"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "{{ opencloud_bind_address }}:{{ opencloud_port }}:9200"
{% if opencloud_reverse_proxy_ip %}
    extra_hosts:
{% for host in opencloud_extra_hosts %}
      - "{{ host }}:{{ opencloud_reverse_proxy_ip }}"
{% endfor %}
{% endif %}
    logging:
      driver: local
    restart: always
{% if opencloud_collabora_enabled %}

  collabora:
    container_name: opencloud_collabora
    image: "{{ opencloud_collabora_image }}:{{ opencloud_collabora_version }}"
    networks:
      - opencloud-net
    environment:
      # WOPI host allowlist
      aliasgroup1: "https://{{ opencloud_domain }}"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.ssl_verification={{ opencloud_collabora_ssl_verification | string | lower }}
        --o:ssl.termination=true
        --o:welcome.enable=false
        --o:net.frame_ancestors={{ opencloud_domain }}
        --o:net.lok_allow.host[14]={{ opencloud_domain }}
        --o:home_mode.enable={{ opencloud_collabora_home_mode | string | lower }}
      username: "{{ opencloud_collabora_admin_user }}"
      password: "{{ opencloud_collabora_admin_password }}"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor:unconfined
    volumes:
      - ./collabora_proof_key:/etc/coolwsd/proof_key:ro
{% if opencloud_collabora_fonts_path %}
      - "{{ opencloud_collabora_fonts_path }}:/usr/share/fonts/truetype/more:ro"
      - "{{ opencloud_collabora_fonts_path }}:/opt/cool/systemplate/usr/share/fonts/truetype/more:ro"
{% endif %}
    ports:
      - "{{ opencloud_collabora_bind_address }}:{{ opencloud_collabora_port }}:9980"
{% if opencloud_reverse_proxy_ip %}
    extra_hosts:
{% for host in opencloud_extra_hosts %}
      - "{{ host }}:{{ opencloud_reverse_proxy_ip }}"
{% endfor %}
{% endif %}
    logging:
      driver: local
    restart: always
    healthcheck:
      test: ["CMD", "/usr/bin/coolwsd", "--probe", "--use-env-vars"]
      interval: 15s
      timeout: 10s
      retries: 5
{% endif %}
{% if opencloud_radicale_enabled %}

  # CalDAV/CardDAV, reachable via /caldav/ and /carddav/ on the opencloud domain
  radicale:
    container_name: opencloud_radicale
    image: "{{ opencloud_radicale_image }}:{{ opencloud_radicale_version }}"
    user: "{{ opencloud_uid }}:{{ opencloud_gid }}"
    networks:
      - opencloud-net
    volumes:
      - ./radicale.config:/etc/radicale/config:ro
      - "{{ opencloud_radicale_data_path }}:/var/lib/radicale"
    logging:
      driver: local
    restart: always
{% endif %}

networks:
  opencloud-net:
