# Based on config/opencloud/proxy.yaml from opencloud-compose (main).
# Additional routes of the OpenCloud proxy:
# - /yjs to the yjs container (real-time collaboration, websocket)
# - CalDAV/CardDAV (incl. /.well-known) to radicale; OpenCloud handles
#   authentication and passes the user in X-Remote-User
additional_policies:
  - name: default
    routes:
{% if opencloud_yjs_enabled | bool %}
      - endpoint: /yjs
        backend: http://yjs:1234
        unprotected: true
{% endif %}
{% if opencloud_radicale_enabled | bool %}
{% for dav in ['caldav', 'carddav'] %}
      - endpoint: /{{ dav }}/
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /{{ dav }}
      - endpoint: /.well-known/{{ dav }}
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /{{ dav }}
{% endfor %}
{% endif %}
