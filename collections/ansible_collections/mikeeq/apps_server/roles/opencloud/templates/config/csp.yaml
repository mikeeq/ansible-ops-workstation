# Based on config/opencloud/csp.yaml from opencloud-compose (main)
directives:
  child-src:
    - '''self'''
  connect-src:
    - '''self'''
    - 'blob:'
    - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
    - 'https://update.opencloud.eu/'
    - 'https://tile.openstreetmap.org/'
{% if opencloud_calendar_enabled | bool and opencloud_calendar_location_search | bool %}
    # web-calendar location autocomplete
    - 'https://nominatim.openstreetmap.org/'
{% endif %}
  default-src:
    - '''none'''
  font-src:
    - '''self'''
{% if opencloud_calendar_enabled | bool %}
    # web-calendar (FullCalendar icon font)
    - 'data:'
{% endif %}
  frame-ancestors:
    - '''self'''
  frame-src:
    - '''self'''
    - 'blob:'
    - 'https://embed.diagrams.net/'
{% if opencloud_office %}
    - 'https://{{ opencloud_office_domain }}/'
{% endif %}
    - 'https://docs.opencloud.eu'
  img-src:
    - '''self'''
    - 'data:'
    - 'blob:'
    - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
    - 'https://tile.openstreetmap.org/'
{% if opencloud_office %}
    - 'https://{{ opencloud_office_domain }}/'
{% endif %}
  manifest-src:
    - '''self'''
  media-src:
    - '''self'''
  object-src:
    - '''self'''
    - 'blob:'
  script-src:
    - '''self'''
    - '''unsafe-inline'''
  style-src:
    - '''self'''
    - '''unsafe-inline'''
    - 'blob:'
  worker-src:
    - '''self'''
    - 'blob:'
