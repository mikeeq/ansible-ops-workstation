---
- name: Create backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ backup_restic_config_dir }}"
    - "{{ backup_restic_repository | dirname }}"
    - "{{ backup_restic_staging_dir }}"

- name: Write restic repository password
  ansible.builtin.copy:
    content: "{{ backup_restic_password }}"
    dest: "{{ backup_restic_config_dir }}/password"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write restic exclude file
  ansible.builtin.template:
    src: excludes.j2
    dest: "{{ backup_restic_config_dir }}/excludes"
    owner: root
    group: root
    mode: "0600"

- name: Install backup script
  ansible.builtin.template:
    src: backup-restic.sh.j2
    dest: "{{ backup_restic_script_path }}"
    owner: root
    group: root
    mode: "0700"

- name: Configure off-site repository
  when: backup_restic_offsite_enabled | bool
  block:
    - name: Ensure off-site repository password is set
      ansible.builtin.assert:
        that:
          - backup_restic_offsite_password | length >= 16
        fail_msg: "backup_restic_offsite_password is not set (define it in the private inventory)."
        quiet: true

    - name: Write off-site repository password
      ansible.builtin.copy:
        content: "{{ backup_restic_offsite_password }}"
        dest: "{{ backup_restic_config_dir }}/offsite-password"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # rclone rewrites rclone.conf whenever it refreshes the access token, so the
    # role only manages a seed and replaces rclone.conf when the seed changes
    - name: Write rclone config seed
      ansible.builtin.template:
        src: rclone.conf.j2
        dest: "{{ backup_restic_offsite_rclone_config }}.seed"
        owner: root
        group: root
        mode: "0600"
      register: backup_restic_rclone_seed
      no_log: true

    - name: Check rclone config
      ansible.builtin.stat:
        path: "{{ backup_restic_offsite_rclone_config }}"
      register: backup_restic_rclone_config

    - name: Install rclone config from seed
      ansible.builtin.copy:
        src: "{{ backup_restic_offsite_rclone_config }}.seed"
        dest: "{{ backup_restic_offsite_rclone_config }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: backup_restic_rclone_seed.changed or not backup_restic_rclone_config.stat.exists
