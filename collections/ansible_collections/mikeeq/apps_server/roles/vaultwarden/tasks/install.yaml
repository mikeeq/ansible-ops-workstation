---
- name: Ensure install dir exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ vaultwarden_install_path }}"
    - "{{ vaultwarden_install_path }}/data"

- name: Configure docker-compose file
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ vaultwarden_install_path }}/{{ item }}"
    mode: "0664"
    backup: true
  loop:
    - docker-compose.yaml

- name: Pull Docker image using docker-compose
  ansible.builtin.command: docker-compose pull
  changed_when: vaultwarden_pull_result.stderr_lines | length > 2
  register: vaultwarden_pull_result
  args:
    chdir: "{{ vaultwarden_install_path }}"

- name: Run using docker-compose
  ansible.builtin.command: docker-compose up -d
  changed_when: vaultwarden_up_result.stderr_lines | length > 2
  register: vaultwarden_up_result
  args:
    chdir: "{{ vaultwarden_install_path }}"
