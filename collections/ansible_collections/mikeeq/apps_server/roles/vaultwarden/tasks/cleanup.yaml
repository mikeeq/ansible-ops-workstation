---
- name: Stop container using docker-compose
  ansible.builtin.command: docker-compose stop
  changed_when: vaultwarden_up_result.stderr_lines | length > 1
  register: vaultwarden_up_result
  args:
    chdir: "{{ vaultwarden_install_path }}"

- name: Remove all volumes/containers using docker-compose
  ansible.builtin.command: docker-compose rm -vf
  args:
    chdir: "{{ vaultwarden_install_path }}"

- name: Ensure vaultwarden_install_path dir is removed
  ansible.builtin.file:
    path: "{{ vaultwarden_install_path }}"
    state: absent
