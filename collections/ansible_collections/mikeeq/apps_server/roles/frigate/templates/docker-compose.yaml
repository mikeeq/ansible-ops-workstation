# https://docs.docker.com/compose/compose-file/compose-file-v3/
# https://docs.frigate.video/installation
# blue iris + deepstack, agentdvr
---
services:
  frigate:
    container_name: frigate
    # Not privileged: NVIDIA devices come from the GPU reservation below
    network_mode: host
    restart: always
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    deploy:
      resources:
        limits:
          cpus: 4
          # Large semantic search + face recognition models use ~7 GB
          memory: 12G
          # pids: 1
        reservations:
          cpus: 1
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "256mb"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config.yaml:/config/config.yaml
      - /mnt/hdd/frigate:/media/frigate
      - ./frigatedb:/db
      - ./yolo_nas_s.onnx:/config/yolo_nas_s.onnx
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    # No `ports:` with network_mode: host – Frigate listens on 5000/8971,
    # go2rtc on 8554 (RTSP) and 8555 (WebRTC) directly on the host
    environment: {}
      # - YOLO_MODELS=yolov7-320,yolov7x-640
      # - YOLO_MODELS=yolov7-320
      # - TRT_MODEL_PREP_DEVICE=0
      # - USE_FP16=false
      # - FRIGATE_RTSP_PASSWORD="pass"
