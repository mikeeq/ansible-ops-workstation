---
- name: Run Steam and battle.net
  ansible.builtin.shell: |
    if ps -ef | grep -v grep | grep -w "Battle.net.exe"; then
      echo "Steam is already running"
    else
      DISPLAY=:0 flatpak run com.valvesoftware.Steam steam://rungameid/16901283689520955392 & disown

      while :
      do
        echo "Wait for Steam and Battle.net to be up and running..."
        if ps -ef | grep -v grep | grep -w "Battle.net.exe"; then
          break
        fi
        sleep 1
      done
    fi
  register: steam_battle_flag
  async: 360
  poll: 0

- name: Check steam_battle_flag sync status
  ansible.builtin.async_status:
    jid: "{{ steam_battle_flag.ansible_job_id }}"
  register: steam_battle_flag_results
  until: steam_battle_flag_results.finished
  retries: 30

- name: Run Steam and Epic Games Launcher
  ansible.builtin.shell: |
    if ps -ef | grep -v grep | grep -i "epic"; then
      echo "Steam is already running"
    else
      DISPLAY=:0 flatpak run com.valvesoftware.Steam steam://rungameid/11884185060800200704 & disown

      while :
      do
        echo "Wait for Steam and Epic Games Launcher to be up and running..."
        if ps -ef | grep -v grep | grep -i "epic"; then
          break
        fi
        sleep 1
      done
    fi
  register: steam_epic_flag
  # changed_when: '"Wait for Steam" in steam_epic_flag.stdout'
  async: 360
  poll: 0

- name: Check steam_epic_flag sync status
  ansible.builtin.async_status:
    jid: "{{ steam_epic_flag.ansible_job_id }}"
  register: steam_epic_flag_results
  until: steam_epic_flag_results.finished
  retries: 30
