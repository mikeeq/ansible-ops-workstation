---
# ~/.local/share/flatpak/app/com.symless.Synergy/current/active/files/bin/synergy-core server --synergy_version
# /var/lib/flatpak/app/com.symless.Synergy/current/active/files/bin/synergy-core server --synergy_version | grep -i synergy-core | awk '{print $2}' | cut -d'-' -f1
- name: Get installed synergy_version of synergy
  become: true
  become_user: "{{ user_name }}"
  ansible.builtin.shell: /var/lib/flatpak/app/com.symless.Synergy/current/active/files/bin/synergy-core server --version | grep -i synergy-core | awk '{print
    $2}' | cut -d'-' -f3 | cut -d',' -f1
  register: synergy_installed_version
  changed_when: false
  ignore_errors: true

- name: "Installed synergy_version of synergy:"
  ansible.builtin.debug:
    var: synergy_installed_version.stdout

- name: Include get_latest_version.yaml
  ansible.builtin.include_tasks: get_latest_version.yaml
  when: synergy_version is not defined

- name: Include install.yaml
  ansible.builtin.include_tasks: install.yaml
  when:
    - synergy_installed_version.stdout != synergy_version
