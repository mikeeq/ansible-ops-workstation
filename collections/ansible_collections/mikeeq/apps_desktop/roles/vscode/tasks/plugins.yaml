---
- name: List installed extensions
  become: true
  become_user: "{{ user_name }}"
  ansible.builtin.shell: code --list-extensions
  register: vscode_installed_extensions
  changed_when: false

# - name: Remove extensions
#   become: true
#   become_user: "{{ user_name }}"
#   ansible.builtin.shell: code --uninstall-extension {{ item }}
#   with_items:
#     - "{{ vscode_installed_extensions.stdout_lines }}"

- name: Install extensions
  become: true
  become_user: "{{ user_name }}"
  ansible.builtin.shell: code --ignore-certificate-errors --install-extension {{ item }}
  when: item not in vscode_installed_extensions.stdout_lines
  with_items:
    - "{{ vscode_extensions }}"
