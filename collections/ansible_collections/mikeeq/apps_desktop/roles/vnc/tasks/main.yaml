---
- name: Get latest vnc_version
  ansible.builtin.shell: curl -s https://www.realvnc.com/en/connect/download/viewer/linux/ | grep VNC-Viewer | cut -d'-' -f3 | head -n1
  register: vnc_version
  changed_when: false

- name: "Latest vnc_version of VNC-Viewer:"
  ansible.builtin.debug:
    var: vnc_version.stdout

- name: Install VNC-Viewer
  ansible.builtin.dnf:
    name: "https://www.realvnc.com/download/file/viewer.files/VNC-Viewer-{{ vnc_version.stdout }}-Linux-x64.rpm"
    state: present
