# SEE: https://github.com/gitleaks/gitleaks/#configuration

[extend]
useDefault = true # SEE: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

[allowlist]
regexTarget = "line"
paths = [
  '''.terraform.lock.hcl''',
  '''poetry.lock''',
  '''yarn.lock''',
  '''.*\.tfvars\.example''',
  '''.*README\.md''',
  '''.trivy-cache''',
  '''.terragrunt-cache''',
  '''.external_modules''',
  '''.pre-commit-config\.yaml''',
]
regexes = [
  '''client_id''',
]
