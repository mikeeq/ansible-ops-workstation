---
repos:
  # https://github.com/pre-commit/pre-commit-hooks/releases
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: "zabbix_agent_custom_who(?:2)?\\.pp"
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: (^|/)templates/.*\.ya?ml$|^collections/ansible_collections/mikeeq/apps_server/roles/home_assistant/files/config/.*\.ya?ml$
      # - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
        exclude: collections/ansible_collections/mikeeq/apps/roles/openvpn_client/files/client.ovpn
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master, --branch, develop]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint
        description: This hook runs yamllint.
        entry: yamllint
        language: python
        types:
          - file
          - yaml
        # exclude: '(^|/)templates/.*\.ya?ml$'

  # - repo: https://github.com/lyz-code/yamlfix
  #   rev: 1.16.1
  #   hooks:
  #     - id: yamlfix
  #       name: yamlfix
  #       entry: yamlfix
  #       language: python
  #       language_version: python3
  #       types:
  #         - yaml
  #       exclude: (^|/)templates/.*\.ya?ml$
  #       args:
  #         - -c .yamlfix.toml

  # - repo: https://github.com/zricethezav/gitleaks
  #   rev: v8.27.2
  #   hooks:
  #     - id: gitleaks

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        exclude: collections/ansible_collections/mikeeq/servers/roles/openwrt_dynamic_sqm_lte/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: convert-yml-to-yaml
        name: Convert .yml files to .yaml
        entry: scripts/convert_yml_to_yaml.sh
        language: system
        files: \.yml$
        exclude: "molecule/|meta/|galaxy\\.yml"

      # - id: shellcheck
      #   name: shellcheck
      #   entry: shellcheck --severity=warning
      #   language: system
      #   types:
      #     - shell

      - id: gitleaks
        name: gitleaks
        entry: gitleaks detect --no-git --redact --verbose --config=gitleaks.toml
        language: system
        pass_filenames: false


  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
