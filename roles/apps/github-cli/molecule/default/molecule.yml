---
driver:
  name: docker
platforms:
  - name: fedora
    image: aow-fedora:latest
    dockerfile: ../../../../Dockerfile
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: false
  - name: ubuntu
    image: ubuntu:26.04
    command: /bin/bash
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../.."
verifier:
  name: ansible
