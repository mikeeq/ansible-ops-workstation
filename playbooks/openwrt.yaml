# # DNS now runs on the BPI-R4 as macvlan containers (coredns .11, adguard .12)
# # on the `lanmac` network created by the openwrt_setup docker role. Cert
# # issuance (letsencrypt_coredns) stays off OpenWrt - see vms.yaml.
- name: Provision DNS containers on BPI-R4
  hosts:
    - openwrt_bpir4garage
  become: true
  gather_facts: true
  roles:
    - mikeeq.apps_server.coredns
    - mikeeq.apps_server.adguard_home

