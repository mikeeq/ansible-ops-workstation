---
# Playbook: Deploy OpenMPTCProuter VM on AlmaLinux 10 baremetal hypervisor
#
# This playbook:
#   1. Sets up libvirt/QEMU on the AlmaLinux 10 host
#   2. Downloads and prepares the OpenMPTCProuter x86_64 image
#   3. Creates a VM with:
#      - NAT NIC (eth0 inside VM) — for management access from baremetal via 192.168.122.0/24
#      - macvtap NIC(s) (eth1+ inside VM) — direct-attach WAN interfaces
#      - Serial console (virsh console openmptcprouter)
#
# Usage:
#   ansible-playbook -i inventory/hosts.yaml playbooks/openmptcprouter.yaml -K
#   ansible-playbook -i inventory/hosts.yaml playbooks/openmptcprouter.yaml --check --diff
#
# After deployment:
#   virsh console openmptcprouter          # attach serial console (Ctrl+] to exit)
#   virsh domifaddr openmptcprouter        # get NAT IP (192.168.122.x)
#   ssh root@<nat-ip>                      # SSH into the VM (default OpenWrt password: empty)

- name: Deploy OpenMPTCProuter VM on AlmaLinux 10 hypervisor
  hosts: "{{ hosts_to_deploy | default('almalinux_baremetal') }}"
  become: true
  vars:
    # Override these vars per-host via host_vars or extra-vars:
    #
    # openmptcprouter_vm_macvtap_interfaces:
    #   - dev: "enp3s0"      # WAN1 physical NIC name
    #     mode: "bridge"
    #   - dev: "enp4s0"      # WAN2 physical NIC name (optional)
    #     mode: "bridge"
    #
    # openmptcprouter_vm_image_url: "https://github.com/Ysurac/openmptcprouter/releases/download/0.64.8/..."
    # openmptcprouter_vm_force_recreation: false
  roles:
    - mikeeq.servers.openmptcprouter_vm
