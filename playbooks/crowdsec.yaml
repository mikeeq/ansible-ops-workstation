---
# CrowdSec security engine on mikeeClevo: detection and notifications only,
# no bouncer (nothing is blocked).
# Usage:
#   ansible-playbook -i inventory/hosts.yaml -i ../ansible-ops-private/inventory/hosts.yaml playbooks/crowdsec.yaml
- name: CrowdSec
  hosts: mikeeClevo
  become: true
  roles:
    - mikeeq.apps_server.crowdsec
