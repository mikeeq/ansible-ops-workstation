---
# ansible_architecture == "aarch64"
architecture_common_name: "arm64"

# Standard macOS Apple Silicon prefix - required for pre-built bottles
brew_install_path: /opt/homebrew

brew_trust_taps:
  - hashicorp/tap
  - deskflow/tap

brew_pkgs:
  - gpg
  - pinentry-mac
  - mise
  - htop
  - ctop
  - dive
  - ollama
  - graphviz
  - azure-cli
  - awscli
  - kubectl
  - terraform
  - terragrunt
  - helm
  - gh
  # - copilot-cli
  # - kustomize
  # - k9s
  # - stern
  # - lazygit
  # - neovim
  # - tmux
  # - fzf
  # - gh
  # - ghq
  # - ghz
  # - gh-ost

brew_cask_pkgs:
  - bitwarden
  - deskflow
  - firefox
  - google-chrome
  - iterm2
  - lm-studio
  - ollama
  - rancher
  - slack
  - spotify
  - utm
  - visual-studio-code
