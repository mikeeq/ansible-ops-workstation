---
- name: Include a playbook for including arch specifc vars
  ansible.builtin.import_playbook: ../playbooks/vars.yaml

- name: Test playbook - install from git and run roles
  hosts: localhost
  connection: local
  become: false

  collections:
    - mikeeq.apps

  pre_tasks:
    - name: Create temporary directory for ansible-galaxy collection installation
      ansible.builtin.file:
        path: "{{ playbook_dir }}/tmp/ansible"
        state: directory

    - name: Install test requirements
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r {{ playbook_dir }}/requirements.yaml --force -p {{ playbook_dir }}/tmp/ansible
      changed_when: true

    - name: Gather facts
      ansible.builtin.setup:

    - name: Create temporary directory for GitHub Copilot CLI installation
      ansible.builtin.file:
        path: "{{ playbook_dir }}/tmp/bin"
        state: directory

  roles:
    - role: mikeeq.apps.github_copilot_cli
      github_copilot_cli_install_dir: "{{ playbook_dir }}/tmp/bin"

  post_tasks:
    - name: Smoke test - verify gh is installed
      ansible.builtin.command:
        cmd: gh --version
      register: gh_version
      changed_when: false

    - name: Assert gh CLI is functional
      ansible.builtin.assert:
        that:
          - gh_version.rc == 0
          - "'gh version' in gh_version.stdout"
        fail_msg: "GitHub CLI is not properly installed"
        success_msg: "GitHub CLI {{ gh_version.stdout_lines[0] }} is working"
